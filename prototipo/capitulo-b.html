<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0A0E1A">
<title>Guardianes del Control — Capítulo B</title>
<style>
  /* Juego móvil: identidad cinematográfica oscura (single-theme intencional). */
  :root {
    color-scheme: dark;
    --bg: #0A0E1A;
    --bg2: #0E1424;
    --panel: #141C2E;
    --panel2: #1A2338;
    --glass: rgba(24, 32, 52, .72);
    --border: #26314D;
    --border2: #313E5E;
    --text: #EAF0FA;
    --muted: #8A97B4;
    --amber: #FF8A3D;
    --amber2: #FF6B1A;
    --gold: #FFC53D;
    --teal: #2DD4BF;
    --violet: #9B7BFF;
    --red: #FF5A5F;
    --r: 20px;
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    background:
      radial-gradient(1200px 700px at 50% -10%, #16203A 0%, transparent 60%),
      radial-gradient(900px 600px at 80% 110%, #1A1330 0%, transparent 55%),
      #05070E;
    color: var(--text); font-family: var(--font);
    display: flex; justify-content: center; min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  .telefono {
    width: 100%; max-width: 440px; min-height: 100vh;
    background: linear-gradient(180deg, var(--bg) 0%, var(--bg2) 100%);
    display: flex; flex-direction: column; position: relative; overflow: hidden;
    box-shadow: 0 0 0 1px rgba(120,150,220,.08), 0 30px 80px rgba(0,0,0,.6);
  }
  @media (min-width: 480px) {
    body { padding: 22px 0; align-items: center; }
    .telefono { min-height: calc(100vh - 44px); border-radius: 34px; }
  }

  /* ------------------------------ HUD ------------------------------ */
  #hud {
    position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 10px;
    padding: 12px 14px; background: var(--glass);
    backdrop-filter: blur(16px) saturate(1.4); -webkit-backdrop-filter: blur(16px) saturate(1.4);
    border-bottom: 1px solid rgba(120,150,220,.12);
  }
  .hud-menu {
    order: 3; width: 34px; height: 34px; flex: none; border-radius: 11px; cursor: pointer;
    background: var(--panel2); border: 1px solid var(--border); color: var(--muted); font-size: 16px;
  }
  .hud-menu:active { transform: rotate(-90deg); }
  .hud-perfil { flex: 1; display: flex; align-items: center; gap: 10px; min-width: 0; }
  .hud-avatar { width: 40px; height: 40px; border-radius: 50%; flex: none; overflow: hidden;
    border: 2px solid var(--amber); box-shadow: 0 0 14px rgba(255,138,61,.4); }
  .hud-avatar svg { display: block; }
  .hud-nivel { flex: 1; min-width: 0; }
  .hud-nivel-top { display: flex; justify-content: space-between; font-size: 11px; margin-bottom: 4px; }
  .hud-nivel-top span:first-child { font-weight: 800; letter-spacing: .3px; }
  .hud-xp-num { color: var(--muted); font-variant-numeric: tabular-nums; }
  .hud-xpbar { height: 7px; background: #0A0F1C; border-radius: 6px; overflow: hidden; border: 1px solid var(--border); }
  .hud-xpfill { height: 100%; border-radius: 6px; width: 0;
    background: linear-gradient(90deg, var(--gold), var(--amber2));
    box-shadow: 0 0 10px rgba(255,138,61,.6); transition: width .8s cubic-bezier(.2,.8,.2,1); }

  .hud-score { display: flex; align-items: center; gap: 6px; flex: none; padding: 4px 10px 4px 6px;
    border-radius: 13px; background: var(--panel2); border: 1px solid var(--border); }
  .hud-score.ok { color: var(--teal); } .hud-score.med { color: var(--gold); } .hud-score.bajo { color: var(--red); }
  .hud-score-txt { display: flex; flex-direction: column; line-height: 1; }
  .hud-score-txt b { font-size: 17px; font-variant-numeric: tabular-nums; }
  .hud-score-txt small { font-size: 8.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }

  .flotante-xp {
    position: absolute; top: 46px; left: 60px; font-weight: 800; font-size: 15px; color: var(--gold);
    text-shadow: 0 2px 10px rgba(255,197,61,.6); pointer-events: none;
    animation: subeXP 1.1s ease forwards;
  }
  @keyframes subeXP { 0% { opacity: 0; transform: translateY(6px) scale(.8);} 20% { opacity: 1; } 100% { opacity: 0; transform: translateY(-28px) scale(1.1);} }

  /* ------------------------------ APP ------------------------------ */
  #app { flex: 1; position: relative; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; }
  #app > * { animation: entra .4s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes entra { from { opacity: 0; transform: translateY(14px);} to { opacity: 1; transform: none;} }
  #app { padding: 16px 16px 40px; }
  #app:has(.portada) { padding: 0; }

  /* ---------------------------- PORTADA ---------------------------- */
  .portada { display: flex; flex-direction: column; min-height: 100%; }
  .portada-cielo { position: relative; height: 240px; overflow: hidden; }
  .portada-cielo svg { width: 100%; height: 100%; object-fit: cover; }
  .portada-cielo::after { content: ""; position: absolute; inset: 0;
    background: linear-gradient(180deg, transparent 40%, var(--bg) 100%); }
  .dust { position: absolute; width: 4px; height: 4px; border-radius: 50%; background: #FFD9A0;
    opacity: .7; left: 20%; top: 60%; animation: flota 6s ease-in-out infinite; }
  .dust.d2 { left: 55%; top: 40%; animation-delay: 2s; width: 3px; height: 3px; }
  .dust.d3 { left: 78%; top: 70%; animation-delay: 4s; }
  @keyframes flota { 0%,100% { transform: translateY(0); opacity:.3;} 50% { transform: translateY(-16px); opacity:.9;} }

  .portada-cont { flex: 1; margin-top: -60px; padding: 0 22px 30px; text-align: center;
    display: flex; flex-direction: column; align-items: center; position: relative; z-index: 2; }
  .logo-escudo { filter: drop-shadow(0 10px 30px rgba(255,107,26,.4)); animation: latido 3.5s ease-in-out infinite; }
  @keyframes latido { 0%,100% { transform: translateY(0);} 50% { transform: translateY(-6px);} }
  .portada-titulo { font-size: 32px; font-weight: 900; letter-spacing: -.5px; margin: 8px 0 2px;
    line-height: 1.02; text-wrap: balance;
    background: linear-gradient(180deg, #FFF 0%, #FFD9A8 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .portada-sub { color: var(--muted); font-size: 13px; max-width: 300px; }
  .portada-chip { margin-top: 14px; font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .8px;
    color: var(--amber); background: rgba(255,138,61,.12); border: 1px solid rgba(255,138,61,.35);
    padding: 6px 14px; border-radius: 999px; }
  .portada .dialogo { margin-top: 22px; text-align: left; }
  .grande { margin-top: 22px; font-size: 17px; padding: 17px; }

  /* ----------------------------- CARDS ----------------------------- */
  .chip-paso { display: inline-block; font-size: 10.5px; font-weight: 800; text-transform: uppercase;
    letter-spacing: .7px; color: var(--amber); background: rgba(255,138,61,.1);
    border: 1px solid rgba(255,138,61,.3); padding: 5px 11px; border-radius: 999px; margin-bottom: 12px; }
  .card { background: linear-gradient(180deg, var(--panel) 0%, #111827 100%);
    border: 1px solid var(--border); border-radius: var(--r); margin-bottom: 14px; overflow: hidden;
    box-shadow: 0 10px 30px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.04); }
  .card-pad { padding: 16px 18px 18px; }
  h2 { font-size: 21px; font-weight: 800; line-height: 1.15; letter-spacing: -.3px; margin: 0 0 10px; text-wrap: balance; }
  .cuerpo { font-size: 15px; line-height: 1.58; color: #CCD6E6; margin: 0; }

  .escena { position: relative; height: 168px; overflow: hidden; }
  .escena svg { width: 100%; height: 100%; display: block; }
  .escena-fade { position: absolute; inset: 0; background: linear-gradient(180deg, transparent 55%, var(--panel) 100%); }

  /* --------------------------- DIÁLOGO ----------------------------- */
  .dialogo { display: flex; gap: 12px; align-items: flex-start; margin-top: 16px;
    background: linear-gradient(135deg, rgba(155,123,255,.1), rgba(45,212,191,.06));
    border: 1px solid var(--border2); border-left: 3px solid var(--amber);
    border-radius: 14px; padding: 12px 13px; }
  .dialogo.chico { margin-top: 12px; }
  .dialogo-av { width: 54px; height: 54px; flex: none; border-radius: 50%; overflow: hidden;
    border: 2px solid var(--amber); box-shadow: 0 0 16px rgba(255,138,61,.35); }
  .dialogo-av svg { display: block; width: 100%; height: 100%; }
  .dialogo-cuerpo { min-width: 0; }
  .dialogo-nombre { font-size: 13px; font-weight: 800; margin-bottom: 3px; display: flex; flex-direction: column; }
  .dialogo-nombre span { font-size: 10.5px; font-weight: 500; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; }
  .dialogo-texto { font-size: 13.5px; line-height: 1.5; color: #E4EAF5; font-style: italic; }

  /* ---------------------------- BOTONES ---------------------------- */
  .btn { display: flex; align-items: center; gap: 10px; width: 100%; border-radius: 14px;
    padding: 15px 16px; font-size: 15px; font-family: var(--font); line-height: 1.35;
    border: 1px solid var(--border2); background: var(--panel2); color: var(--text);
    cursor: pointer; text-align: left; transition: transform .09s ease, border-color .2s, background .2s, box-shadow .2s; }
  .btn:active { transform: scale(.98); }
  .btn.primario { justify-content: center; font-weight: 800; letter-spacing: .2px; border: none;
    background: linear-gradient(180deg, var(--amber) 0%, var(--amber2) 100%); color: #1A0E05;
    box-shadow: 0 8px 22px rgba(255,107,26,.35), inset 0 1px 0 rgba(255,255,255,.4); margin-top: 4px; }
  .btn.primario span { font-weight: 900; }
  .btn.primario:active { box-shadow: 0 3px 12px rgba(255,107,26,.4); }

  .opciones, .items { display: flex; flex-direction: column; gap: 10px; }
  .opcion { position: relative; }
  .opcion:hover { border-color: var(--amber); }
  .op-dot { width: 12px; height: 12px; flex: none; border-radius: 50%; border: 2px solid var(--border2); transition: .2s; }
  .opcion:hover .op-dot { border-color: var(--amber); box-shadow: 0 0 10px rgba(255,138,61,.5); }
  .op-letra { width: 26px; height: 26px; flex: none; border-radius: 9px; display: flex; align-items: center;
    justify-content: center; font-weight: 800; font-size: 13px; background: #0F1728; border: 1px solid var(--border2); color: var(--muted); }
  .inerte { opacity: .45; }
  .elegida-ok { border-color: var(--teal) !important; background: rgba(45,212,191,.13); opacity: 1; }
  .elegida-ok .op-dot, .elegida-ok .op-letra { border-color: var(--teal); color: var(--teal); background: rgba(45,212,191,.15); }
  .elegida-mal { border-color: var(--red) !important; background: rgba(255,90,95,.13); opacity: 1; }
  .elegida-mal .op-dot, .elegida-mal .op-letra { border-color: var(--red); color: var(--red); }

  /* ----------------------------- ITEMS ----------------------------- */
  .item { display: flex; align-items: center; gap: 12px; background: var(--panel2);
    border: 1px solid var(--border2); border-radius: 14px; padding: 13px 14px; cursor: pointer;
    flex-wrap: wrap; transition: border-color .2s, background .2s; }
  .item:hover { border-color: var(--amber); }
  .item-ic { width: 40px; height: 40px; flex: none; border-radius: 11px; display: flex; align-items: center;
    justify-content: center; background: #0F1728; border: 1px solid var(--border2); }
  .item-txt { flex: 1; font-size: 14px; line-height: 1.35; min-width: 0; }
  .item-check { width: 24px; height: 24px; flex: none; border-radius: 8px; border: 2px solid var(--border2); position: relative; transition: .2s; }
  .item.marcado { border-color: var(--amber); background: rgba(255,138,61,.08); }
  .item.marcado .item-check { background: var(--amber); border-color: var(--amber); }
  .item.marcado .item-check::after { content: "✓"; position: absolute; inset: 0; display: flex; align-items: center;
    justify-content: center; color: #1A0E05; font-weight: 900; font-size: 15px; }
  .item.bloq { cursor: default; }
  .item-ok { border-color: var(--teal) !important; }
  .item-mal { border-color: var(--red) !important; }
  .item-nota { flex-basis: 100%; font-size: 12.5px; line-height: 1.5; padding-top: 10px; margin-top: 2px;
    border-top: 1px dashed var(--border2); color: var(--muted); }
  .item-nota b { color: var(--text); }
  .item-nota.es-mue b { color: var(--teal); } .item-nota.no-mue b { color: var(--gold); }

  /* --------------------------- FEEDBACK ---------------------------- */
  .feedback { border-radius: 16px; padding: 15px 16px; margin: 4px 0 6px; animation: entra .35s ease both; }
  .fb-ok { background: linear-gradient(180deg, rgba(45,212,191,.14), rgba(45,212,191,.05)); border: 1px solid rgba(45,212,191,.5); }
  .fb-mal { background: linear-gradient(180deg, rgba(255,197,61,.13), rgba(255,197,61,.04)); border: 1px solid rgba(255,197,61,.45); }
  .fb-cab { font-weight: 800; font-size: 15px; margin-bottom: 8px; display: flex; align-items: center; gap: 10px; }
  .fb-ok .fb-cab { color: var(--teal); } .fb-mal .fb-cab { color: var(--gold); }
  .fb-delta { font-size: 12px; font-weight: 800; padding: 2px 9px; border-radius: 999px;
    background: rgba(255,255,255,.08); color: var(--text); font-variant-numeric: tabular-nums; }
  .feedback p { font-size: 14px; line-height: 1.55; margin: 0 0 12px; color: #D4DCEA; }

  .quiz-badge { display: inline-block; font-size: 10px; font-weight: 900; letter-spacing: 1.5px;
    color: var(--violet); background: rgba(155,123,255,.14); border: 1px solid rgba(155,123,255,.4);
    padding: 4px 10px; border-radius: 6px; margin-bottom: 10px; }

  /* ----------------------------- FINAL ----------------------------- */
  .final-hero { position: relative; height: 190px; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 50% 40%, #2A2440, #141C2E); overflow: hidden; }
  .final-glow { position: absolute; width: 220px; height: 220px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,138,61,.5), transparent 65%); animation: pulso 3s ease-in-out infinite; }
  @keyframes pulso { 0%,100% { transform: scale(.85); opacity:.5;} 50% { transform: scale(1.1); opacity:.9;} }
  .final-escudo { position: relative; z-index: 2; filter: drop-shadow(0 8px 24px rgba(255,107,26,.5));
    animation: aparece-escudo .7s cubic-bezier(.2,1.4,.4,1) both; }
  @keyframes aparece-escudo { from { transform: scale(.3) rotate(-20deg); opacity: 0; } to { transform: none; opacity: 1; } }
  .final-hero.gris { filter: grayscale(.7) brightness(.8); }
  .resultado { display: flex; gap: 8px; justify-content: center; margin: 14px 0; }
  .metrica { flex: 1; background: var(--panel2); border: 1px solid var(--border2); border-radius: 14px;
    padding: 12px 6px; text-align: center; }
  .metrica b { font-size: 22px; font-weight: 900; display: block; font-variant-numeric: tabular-nums;
    background: linear-gradient(180deg, #FFF, #B9C6DC); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .metrica small { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
  .insignia { display: flex; align-items: center; gap: 12px; justify-content: center; text-align: left;
    background: linear-gradient(135deg, rgba(255,197,61,.15), rgba(255,107,26,.08));
    border: 1px solid rgba(255,197,61,.5); border-radius: 14px; padding: 12px 16px; margin: 4px 0 14px;
    font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; font-weight: 700; }
  .insignia b { display: block; font-size: 15px; color: var(--gold); text-transform: none; letter-spacing: 0; }
  .ins-medalla { font-size: 30px; animation: latido 2s ease-in-out infinite; }
  .prox { text-align: center; font-size: 12.5px; color: var(--muted); margin-top: 14px; padding: 12px;
    background: var(--panel); border: 1px dashed var(--border2); border-radius: 12px; }

  .confeti { position: absolute; inset: 0; pointer-events: none; z-index: 40; }

  /* Diálogo de confirmación propio (sustituye a confirm() nativo) */
  .modal-ov { position: absolute; inset: 0; z-index: 60; display: flex; align-items: center;
    justify-content: center; padding: 24px; background: rgba(5,7,14,.6);
    backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); opacity: 0; transition: opacity .2s; }
  .modal-ov.visible { opacity: 1; }
  .modal { width: 100%; max-width: 320px; background: linear-gradient(180deg, var(--panel), #111827);
    border: 1px solid var(--border2); border-radius: 20px; padding: 20px; text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,.6); transform: scale(.92); transition: transform .2s; }
  .modal-ov.visible .modal { transform: scale(1); }
  .modal h3 { margin: 0 0 8px; font-size: 18px; font-weight: 800; }
  .modal p { margin: 0 0 18px; font-size: 13.5px; color: var(--muted); line-height: 1.5; }
  .modal-btns { display: flex; gap: 10px; }
  .modal-btns .btn { justify-content: center; font-weight: 700; }

  @media (prefers-reduced-motion: reduce) {
    *, #app > * { animation: none !important; transition: none !important; }
  }
  .btn:focus-visible, .item:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

  /* ===================== CAPÍTULO B · PUZZLES ===================== */
  .evento-chip { display:block; text-align:center; font-size:12px; font-weight:800; color:#FFB98A;
    background:rgba(255,107,26,.12); border:1px solid rgba(255,107,26,.4); border-radius:10px;
    padding:8px 10px; margin-bottom:12px; }
  .sorteo-hint { font-size:12.5px; color:var(--amber); margin-bottom:10px; font-weight:600; }
  .sorteo-hint.tenue { color:var(--muted); font-weight:500; }
  .bandeja { display:flex; flex-wrap:wrap; gap:8px; min-height:44px; padding:10px; margin-bottom:14px;
    background:#0F1728; border:1px dashed var(--border2); border-radius:14px; }
  .carta { font-family:var(--font); font-size:12.5px; line-height:1.25; text-align:left; cursor:pointer;
    background:var(--panel2); color:var(--text); border:1px solid var(--border2); border-radius:11px;
    padding:9px 11px; transition:transform .09s, border-color .2s, background .2s; }
  .carta:active { transform:scale(.97); }
  .carta.sel { border-color:var(--gold); box-shadow:0 0 0 2px rgba(255,197,61,.4), 0 0 14px rgba(255,197,61,.3); background:rgba(255,197,61,.1); }
  .carta.puesta { display:block; width:100%; margin-bottom:6px; }
  .carta.puesta.ok { border-color:var(--teal); background:rgba(45,212,191,.14); }
  .carta.puesta.mal { border-color:var(--red); background:rgba(255,90,95,.14); }
  .zonas { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .zona { background:#0F1728; border:1.5px solid var(--zc); border-radius:14px; padding:10px; min-height:120px; cursor:pointer; }
  .zona-cab { text-align:center; margin-bottom:8px; }
  .zona-cab b { display:block; font-size:13px; color:var(--zc); }
  .zona-cab small { font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.4px; }
  .zona-vacia { display:block; text-align:center; font-size:11px; color:var(--muted); padding:12px 4px; font-style:italic; }

  .slots { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-bottom:16px; }
  .slot { min-height:92px; border-radius:14px; display:flex; flex-direction:column; align-items:center;
    justify-content:center; text-align:center; padding:8px 6px; font-size:10.5px; }
  .slot.vacio { border:2px dashed var(--border2); color:var(--muted); font-weight:800; letter-spacing:.5px; background:#0F1728; }
  .slot.lleno { border:2px solid var(--gold); background:rgba(255,197,61,.12); color:var(--text); animation:snap .35s cubic-bezier(.2,1.4,.4,1) both; }
  .slot.lleno span { display:block; font-size:11px; margin-top:6px; line-height:1.25; }
  .slot.lleno::before { content:""; }
  @keyframes snap { from { transform:scale(.4); opacity:0; } to { transform:none; opacity:1; } }
  .filtro-lbl, .fichas-lbl { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.5px; margin-bottom:8px; }
  .cands { display:flex; flex-direction:column; gap:8px; margin-bottom:12px; }
  .cand { font-family:var(--font); font-size:13.5px; text-align:left; cursor:pointer; color:var(--text);
    background:var(--panel2); border:1px solid var(--border2); border-radius:12px; padding:12px 14px; transition:transform .09s, border-color .2s; }
  .cand:hover { border-color:var(--amber); }
  .cand:active { transform:scale(.98); }
  .cand.usado { opacity:.35; text-decoration:line-through; }
  .cand.rechazado { animation:shake .45s; border-color:var(--red); }
  .filtro-msg { font-size:13px; line-height:1.5; border-radius:12px; padding:11px 13px; color:var(--muted);
    background:var(--panel); border:1px solid var(--border2); }
  .filtro-msg.ok { color:#B7F0E4; background:rgba(45,212,191,.1); border-color:rgba(45,212,191,.45); }
  .filtro-msg.mal { color:#FFD08A; background:rgba(255,197,61,.1); border-color:rgba(255,197,61,.45); }

  .frase { font-size:17px; line-height:1.9; margin-bottom:18px; color:#E4EAF5; }
  .hueco { display:inline-block; font-family:var(--font); font-size:15px; font-weight:700; cursor:pointer;
    background:#0F1728; color:var(--gold); border:1px solid var(--border2); border-radius:8px; padding:2px 8px; margin:0 2px; vertical-align:baseline; }
  .hueco.lleno { border-color:var(--gold); background:rgba(255,197,61,.12); }
  .hueco.ok { border-color:var(--teal); color:var(--teal); background:rgba(45,212,191,.14); }
