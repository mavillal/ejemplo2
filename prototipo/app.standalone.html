<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0A0E1A">
<title>Guardianes del Control</title>
<style>
  /* Juego móvil: identidad cinematográfica oscura (single-theme intencional). */
  :root {
    color-scheme: dark;
    --bg: #0A0E1A;
    --bg2: #0E1424;
    --panel: #141C2E;
    --panel2: #1A2338;
    --glass: rgba(24, 32, 52, .72);
    --border: #26314D;
    --border2: #313E5E;
    --text: #EAF0FA;
    --muted: #8A97B4;
    --amber: #FF8A3D;
    --amber2: #FF6B1A;
    --gold: #FFC53D;
    --teal: #2DD4BF;
    --violet: #9B7BFF;
    --red: #FF5A5F;
    --r: 20px;
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    background:
      radial-gradient(1200px 700px at 50% -10%, #16203A 0%, transparent 60%),
      radial-gradient(900px 600px at 80% 110%, #1A1330 0%, transparent 55%),
      #05070E;
    color: var(--text); font-family: var(--font);
    display: flex; justify-content: center; min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  .telefono {
    width: 100%; max-width: 440px; min-height: 100vh;
    background: linear-gradient(180deg, var(--bg) 0%, var(--bg2) 100%);
    display: flex; flex-direction: column; position: relative; overflow: hidden;
    box-shadow: 0 0 0 1px rgba(120,150,220,.08), 0 30px 80px rgba(0,0,0,.6);
  }
  @media (min-width: 480px) {
    body { padding: 22px 0; align-items: center; }
    .telefono { min-height: calc(100vh - 44px); border-radius: 34px; }
  }

  /* ------------------------------ HUD ------------------------------ */
  #hud {
    position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 10px;
    padding: 12px 14px; background: var(--glass);
    backdrop-filter: blur(16px) saturate(1.4); -webkit-backdrop-filter: blur(16px) saturate(1.4);
    border-bottom: 1px solid rgba(120,150,220,.12);
  }
  .hud-btns { order: 3; display: flex; gap: 6px; }
  .hud-menu {
    width: 34px; height: 34px; flex: none; border-radius: 11px; cursor: pointer;
    background: var(--panel2); border: 1px solid var(--border); color: var(--muted); font-size: 16px;
  }
  .hud-menu:active { transform: scale(.88); }
  .hud-perfil { flex: 1; display: flex; align-items: center; gap: 10px; min-width: 0; }
  .hud-avatar { width: 40px; height: 40px; border-radius: 50%; flex: none; overflow: hidden;
    border: 2px solid var(--amber); box-shadow: 0 0 14px rgba(255,138,61,.4); }
  .hud-avatar svg { display: block; }
  .hud-nivel { flex: 1; min-width: 0; }
  .hud-nivel-top { display: flex; justify-content: space-between; font-size: 11px; margin-bottom: 4px; }
  .hud-nivel-top span:first-child { font-weight: 800; letter-spacing: .3px; }
  .hud-xp-num { color: var(--muted); font-variant-numeric: tabular-nums; }
  .hud-xpbar { height: 7px; background: #0A0F1C; border-radius: 6px; overflow: hidden; border: 1px solid var(--border); }
  .hud-xpfill { height: 100%; border-radius: 6px; width: 0;
    background: linear-gradient(90deg, var(--gold), var(--amber2));
    box-shadow: 0 0 10px rgba(255,138,61,.6); transition: width .8s cubic-bezier(.2,.8,.2,1); }

  .hud-score { display: flex; align-items: center; gap: 6px; flex: none; padding: 4px 10px 4px 6px;
    border-radius: 13px; background: var(--panel2); border: 1px solid var(--border); }
  .hud-score.ok { color: var(--teal); } .hud-score.med { color: var(--gold); } .hud-score.bajo { color: var(--red); }
  .hud-score-txt { display: flex; flex-direction: column; line-height: 1; }
  .hud-score-txt b { font-size: 17px; font-variant-numeric: tabular-nums; }
  .hud-score-txt small { font-size: 8.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }

  .flotante-xp {
    position: absolute; top: 46px; left: 60px; font-weight: 800; font-size: 15px; color: var(--gold);
    text-shadow: 0 2px 10px rgba(255,197,61,.6); pointer-events: none;
    animation: subeXP 1.1s ease forwards;
  }
  @keyframes subeXP { 0% { opacity: 0; transform: translateY(6px) scale(.8);} 20% { opacity: 1; } 100% { opacity: 0; transform: translateY(-28px) scale(1.1);} }

  /* ------------------------------ APP ------------------------------ */
  #app { flex: 1; position: relative; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; }
  #app > * { animation: entra .4s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes entra { from { opacity: 0; transform: translateY(14px);} to { opacity: 1; transform: none;} }
  #app { padding: 16px 16px 40px; }
  #app:has(.portada) { padding: 0; }

  /* ---------------------------- PORTADA ---------------------------- */
  .portada { display: flex; flex-direction: column; min-height: 100%; }
  .portada-cielo { position: relative; height: 240px; overflow: hidden; }
  .portada-cielo svg { width: 100%; height: 100%; object-fit: cover; }
  .portada-cielo::after { content: ""; position: absolute; inset: 0;
    background: linear-gradient(180deg, transparent 40%, var(--bg) 100%); }
  .dust { position: absolute; width: 4px; height: 4px; border-radius: 50%; background: #FFD9A0;
    opacity: .7; left: 20%; top: 60%; animation: flota 6s ease-in-out infinite; }
  .dust.d2 { left: 55%; top: 40%; animation-delay: 2s; width: 3px; height: 3px; }
  .dust.d3 { left: 78%; top: 70%; animation-delay: 4s; }
  @keyframes flota { 0%,100% { transform: translateY(0); opacity:.3;} 50% { transform: translateY(-16px); opacity:.9;} }

  .portada-cont { flex: 1; margin-top: -60px; padding: 0 22px 30px; text-align: center;
    display: flex; flex-direction: column; align-items: center; position: relative; z-index: 2; }
  .logo-escudo { filter: drop-shadow(0 10px 30px rgba(255,107,26,.4)); animation: latido 3.5s ease-in-out infinite; }
  @keyframes latido { 0%,100% { transform: translateY(0);} 50% { transform: translateY(-6px);} }
  .portada-titulo { font-size: 32px; font-weight: 900; letter-spacing: -.5px; margin: 8px 0 2px;
    line-height: 1.02; text-wrap: balance;
    background: linear-gradient(180deg, #FFF 0%, #FFD9A8 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .portada-sub { color: var(--muted); font-size: 13px; max-width: 300px; }
  .portada-chip { margin-top: 14px; font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .8px;
    color: var(--amber); background: rgba(255,138,61,.12); border: 1px solid rgba(255,138,61,.35);
    padding: 6px 14px; border-radius: 999px; }
  .portada .dialogo { margin-top: 22px; text-align: left; }
  .grande { margin-top: 22px; font-size: 17px; padding: 17px; }

  /* ----------------------------- CARDS ----------------------------- */
  .chip-paso { display: inline-block; font-size: 10.5px; font-weight: 800; text-transform: uppercase;
    letter-spacing: .7px; color: var(--amber); background: rgba(255,138,61,.1);
    border: 1px solid rgba(255,138,61,.3); padding: 5px 11px; border-radius: 999px; margin-bottom: 12px; }
  .card { background: linear-gradient(180deg, var(--panel) 0%, #111827 100%);
    border: 1px solid var(--border); border-radius: var(--r); margin-bottom: 14px; overflow: hidden;
    box-shadow: 0 10px 30px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.04); }
  .card-pad { padding: 16px 18px 18px; }
  h2 { font-size: 21px; font-weight: 800; line-height: 1.15; letter-spacing: -.3px; margin: 0 0 10px; text-wrap: balance; }
  .cuerpo { font-size: 15px; line-height: 1.58; color: #CCD6E6; margin: 0; }

  .escena { position: relative; height: 168px; overflow: hidden; }
  .escena svg { width: 100%; height: 100%; display: block; }
  .escena-fade { position: absolute; inset: 0; background: linear-gradient(180deg, transparent 55%, var(--panel) 100%); }

  /* --------------------------- DIÁLOGO ----------------------------- */
  .dialogo { display: flex; gap: 12px; align-items: flex-start; margin-top: 16px;
    background: linear-gradient(135deg, rgba(155,123,255,.1), rgba(45,212,191,.06));
    border: 1px solid var(--border2); border-left: 3px solid var(--amber);
    border-radius: 14px; padding: 12px 13px; }
  .dialogo.chico { margin-top: 12px; }
  .dialogo-av { width: 54px; height: 54px; flex: none; border-radius: 50%; overflow: hidden;
    border: 2px solid var(--amber); box-shadow: 0 0 16px rgba(255,138,61,.35); }
  .dialogo-av svg { display: block; width: 100%; height: 100%; }
  .dialogo-cuerpo { min-width: 0; }
  .dialogo-nombre { font-size: 13px; font-weight: 800; margin-bottom: 3px; display: flex; flex-direction: column; }
  .dialogo-nombre span { font-size: 10.5px; font-weight: 500; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; }
  .dialogo-texto { font-size: 13.5px; line-height: 1.5; color: #E4EAF5; font-style: italic; }

  /* ---------------------------- BOTONES ---------------------------- */
  .btn { display: flex; align-items: center; gap: 10px; width: 100%; border-radius: 14px;
    padding: 15px 16px; font-size: 15px; font-family: var(--font); line-height: 1.35;
    border: 1px solid var(--border2); background: var(--panel2); color: var(--text);
    cursor: pointer; text-align: left; transition: transform .09s ease, border-color .2s, background .2s, box-shadow .2s; }
  .btn:active { transform: scale(.98); }
  .btn.primario { justify-content: center; font-weight: 800; letter-spacing: .2px; border: none;
    background: linear-gradient(180deg, var(--amber) 0%, var(--amber2) 100%); color: #1A0E05;
    box-shadow: 0 8px 22px rgba(255,107,26,.35), inset 0 1px 0 rgba(255,255,255,.4); margin-top: 4px; }
  .btn.primario span { font-weight: 900; }
  .btn.primario:active { box-shadow: 0 3px 12px rgba(255,107,26,.4); }

  .opciones, .items { display: flex; flex-direction: column; gap: 10px; }
  .opcion { position: relative; }
  .opcion:hover { border-color: var(--amber); }
  .op-dot { width: 12px; height: 12px; flex: none; border-radius: 50%; border: 2px solid var(--border2); transition: .2s; }
  .opcion:hover .op-dot { border-color: var(--amber); box-shadow: 0 0 10px rgba(255,138,61,.5); }
  .op-letra { width: 26px; height: 26px; flex: none; border-radius: 9px; display: flex; align-items: center;
    justify-content: center; font-weight: 800; font-size: 13px; background: #0F1728; border: 1px solid var(--border2); color: var(--muted); }
  .inerte { opacity: .45; }
  .elegida-ok { border-color: var(--teal) !important; background: rgba(45,212,191,.13); opacity: 1; }
  .elegida-ok .op-dot, .elegida-ok .op-letra { border-color: var(--teal); color: var(--teal); background: rgba(45,212,191,.15); }
  .elegida-mal { border-color: var(--red) !important; background: rgba(255,90,95,.13); opacity: 1; }
  .elegida-mal .op-dot, .elegida-mal .op-letra { border-color: var(--red); color: var(--red); }

  /* ----------------------------- ITEMS ----------------------------- */
  .item { display: flex; align-items: center; gap: 12px; background: var(--panel2);
    border: 1px solid var(--border2); border-radius: 14px; padding: 13px 14px; cursor: pointer;
    flex-wrap: wrap; transition: border-color .2s, background .2s; }
  .item:hover { border-color: var(--amber); }
  .item-ic { width: 40px; height: 40px; flex: none; border-radius: 11px; display: flex; align-items: center;
    justify-content: center; background: #0F1728; border: 1px solid var(--border2); }
  .item-txt { flex: 1; font-size: 14px; line-height: 1.35; min-width: 0; }
  .item-check { width: 24px; height: 24px; flex: none; border-radius: 8px; border: 2px solid var(--border2); position: relative; transition: .2s; }
  .item.marcado { border-color: var(--amber); background: rgba(255,138,61,.08); }
  .item.marcado .item-check { background: var(--amber); border-color: var(--amber); }
  .item.marcado .item-check::after { content: "✓"; position: absolute; inset: 0; display: flex; align-items: center;
    justify-content: center; color: #1A0E05; font-weight: 900; font-size: 15px; }
  .item.bloq { cursor: default; }
  .item-ok { border-color: var(--teal) !important; }
  .item-mal { border-color: var(--red) !important; }
  .item-nota { flex-basis: 100%; font-size: 12.5px; line-height: 1.5; padding-top: 10px; margin-top: 2px;
    border-top: 1px dashed var(--border2); color: var(--muted); }
  .item-nota b { color: var(--text); }
  .item-nota.es-mue b { color: var(--teal); } .item-nota.no-mue b { color: var(--gold); }

  /* --------------------------- FEEDBACK ---------------------------- */
  .feedback { border-radius: 16px; padding: 15px 16px; margin: 4px 0 6px; animation: entra .35s ease both; }
  .fb-ok { background: linear-gradient(180deg, rgba(45,212,191,.14), rgba(45,212,191,.05)); border: 1px solid rgba(45,212,191,.5); }
  .fb-mal { background: linear-gradient(180deg, rgba(255,197,61,.13), rgba(255,197,61,.04)); border: 1px solid rgba(255,197,61,.45); }
  .fb-cab { font-weight: 800; font-size: 15px; margin-bottom: 8px; display: flex; align-items: center; gap: 10px; }
  .fb-ok .fb-cab { color: var(--teal); } .fb-mal .fb-cab { color: var(--gold); }
  .fb-delta { font-size: 12px; font-weight: 800; padding: 2px 9px; border-radius: 999px;
    background: rgba(255,255,255,.08); color: var(--text); font-variant-numeric: tabular-nums; }
  .feedback p { font-size: 14px; line-height: 1.55; margin: 0 0 12px; color: #D4DCEA; }

  .quiz-badge { display: inline-block; font-size: 10px; font-weight: 900; letter-spacing: 1.5px;
    color: var(--violet); background: rgba(155,123,255,.14); border: 1px solid rgba(155,123,255,.4);
    padding: 4px 10px; border-radius: 6px; margin-bottom: 10px; }

  /* ----------------------------- FINAL ----------------------------- */
  .final-hero { position: relative; height: 190px; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 50% 40%, #2A2440, #141C2E); overflow: hidden; }
  .final-glow { position: absolute; width: 220px; height: 220px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,138,61,.5), transparent 65%); animation: pulso 3s ease-in-out infinite; }
  @keyframes pulso { 0%,100% { transform: scale(.85); opacity:.5;} 50% { transform: scale(1.1); opacity:.9;} }
  .final-escudo { position: relative; z-index: 2; filter: drop-shadow(0 8px 24px rgba(255,107,26,.5));
    animation: aparece-escudo .7s cubic-bezier(.2,1.4,.4,1) both; }
  @keyframes aparece-escudo { from { transform: scale(.3) rotate(-20deg); opacity: 0; } to { transform: none; opacity: 1; } }
  .final-hero.gris { filter: grayscale(.7) brightness(.8); }
  .resultado { display: flex; gap: 8px; justify-content: center; margin: 14px 0; }
  .metrica { flex: 1; background: var(--panel2); border: 1px solid var(--border2); border-radius: 14px;
    padding: 12px 6px; text-align: center; }
  .metrica b { font-size: 22px; font-weight: 900; display: block; font-variant-numeric: tabular-nums;
    background: linear-gradient(180deg, #FFF, #B9C6DC); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .metrica small { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
  .insignia { display: flex; align-items: center; gap: 12px; justify-content: center; text-align: left;
    background: linear-gradient(135deg, rgba(255,197,61,.15), rgba(255,107,26,.08));
    border: 1px solid rgba(255,197,61,.5); border-radius: 14px; padding: 12px 16px; margin: 4px 0 14px;
    font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; font-weight: 700; }
  .insignia b { display: block; font-size: 15px; color: var(--gold); text-transform: none; letter-spacing: 0; }
  .ins-medalla { font-size: 30px; animation: latido 2s ease-in-out infinite; }
  .prox { text-align: center; font-size: 12.5px; color: var(--muted); margin-top: 14px; padding: 12px;
    background: var(--panel); border: 1px dashed var(--border2); border-radius: 12px; }

  .confeti { position: absolute; inset: 0; pointer-events: none; z-index: 40; }

  /* Diálogo de confirmación propio (sustituye a confirm() nativo) */
  .modal-ov { position: absolute; inset: 0; z-index: 60; display: flex; align-items: center;
    justify-content: center; padding: 24px; background: rgba(5,7,14,.6);
    backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); opacity: 0; transition: opacity .2s; }
  .modal-ov.visible { opacity: 1; }
  .modal { width: 100%; max-width: 320px; background: linear-gradient(180deg, var(--panel), #111827);
    border: 1px solid var(--border2); border-radius: 20px; padding: 20px; text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,.6); transform: scale(.92); transition: transform .2s; }
  .modal-ov.visible .modal { transform: scale(1); }
  .modal h3 { margin: 0 0 8px; font-size: 18px; font-weight: 800; }
  .modal p { margin: 0 0 18px; font-size: 13.5px; color: var(--muted); line-height: 1.5; }
  .modal-btns { display: flex; gap: 10px; }
  .modal-btns .btn { justify-content: center; font-weight: 700; }

  @media (prefers-reduced-motion: reduce) {
    *, #app > * { animation: none !important; transition: none !important; }
  }
  .btn:focus-visible, .item:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

/* ===================== CAPÍTULO B · PUZZLES ===================== */
  .evento-chip { display:block; text-align:center; font-size:12px; font-weight:800; color:#FFB98A;
    background:rgba(255,107,26,.12); border:1px solid rgba(255,107,26,.4); border-radius:10px;
    padding:8px 10px; margin-bottom:12px; }
  .sorteo-hint { font-size:12.5px; color:var(--amber); margin-bottom:10px; font-weight:600; }
  .sorteo-hint.tenue { color:var(--muted); font-weight:500; }
  .bandeja { display:flex; flex-wrap:wrap; gap:8px; min-height:44px; padding:10px; margin-bottom:14px;
    background:#0F1728; border:1px dashed var(--border2); border-radius:14px; }
  .carta { font-family:var(--font); font-size:12.5px; line-height:1.25; text-align:left; cursor:pointer;
    background:var(--panel2); color:var(--text); border:1px solid var(--border2); border-radius:11px;
    padding:9px 11px; transition:transform .09s, border-color .2s, background .2s; }
  .carta:active { transform:scale(.97); }
  .carta.sel { border-color:var(--gold); box-shadow:0 0 0 2px rgba(255,197,61,.4), 0 0 14px rgba(255,197,61,.3); background:rgba(255,197,61,.1); }
  .carta.puesta { display:block; width:100%; margin-bottom:6px; }
  .carta.puesta.ok { border-color:var(--teal); background:rgba(45,212,191,.14); }
  .carta.puesta.mal { border-color:var(--red); background:rgba(255,90,95,.14); }
  .zonas { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .zona { background:#0F1728; border:1.5px solid var(--zc); border-radius:14px; padding:10px; min-height:120px; cursor:pointer; }
  .zona-cab { text-align:center; margin-bottom:8px; }
  .zona-cab b { display:block; font-size:13px; color:var(--zc); }
  .zona-cab small { font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.4px; }
  .zona-vacia { display:block; text-align:center; font-size:11px; color:var(--muted); padding:12px 4px; font-style:italic; }

  .slots { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-bottom:16px; }
  .slot { min-height:92px; border-radius:14px; display:flex; flex-direction:column; align-items:center;
    justify-content:center; text-align:center; padding:8px 6px; font-size:10.5px; }
  .slot.vacio { border:2px dashed var(--border2); color:var(--muted); font-weight:800; letter-spacing:.5px; background:#0F1728; }
  .slot.lleno { border:2px solid var(--gold); background:rgba(255,197,61,.12); color:var(--text); animation:snap .35s cubic-bezier(.2,1.4,.4,1) both; }
  .slot.lleno span { display:block; font-size:11px; margin-top:6px; line-height:1.25; }
  .slot.lleno::before { content:""; }
  @keyframes snap { from { transform:scale(.4); opacity:0; } to { transform:none; opacity:1; } }
  .filtro-lbl, .fichas-lbl { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.5px; margin-bottom:8px; }
  .cands { display:flex; flex-direction:column; gap:8px; margin-bottom:12px; }
  .cand { font-family:var(--font); font-size:13.5px; text-align:left; cursor:pointer; color:var(--text);
    background:var(--panel2); border:1px solid var(--border2); border-radius:12px; padding:12px 14px; transition:transform .09s, border-color .2s; }
  .cand:hover { border-color:var(--amber); }
  .cand:active { transform:scale(.98); }
  .cand.usado { opacity:.35; text-decoration:line-through; }
  .cand.rechazado { animation:shake .45s; border-color:var(--red); }
  .filtro-msg { font-size:13px; line-height:1.5; border-radius:12px; padding:11px 13px; color:var(--muted);
    background:var(--panel); border:1px solid var(--border2); }
  .filtro-msg.ok { color:#B7F0E4; background:rgba(45,212,191,.1); border-color:rgba(45,212,191,.45); }
  .filtro-msg.mal { color:#FFD08A; background:rgba(255,197,61,.1); border-color:rgba(255,197,61,.45); }

  .frase { font-size:17px; line-height:1.9; margin-bottom:18px; color:#E4EAF5; }
  .hueco { display:inline-block; font-family:var(--font); font-size:15px; font-weight:700; cursor:pointer;
    background:#0F1728; color:var(--gold); border:1px solid var(--border2); border-radius:8px; padding:2px 8px; margin:0 2px; vertical-align:baseline; }
  .hueco.lleno { border-color:var(--gold); background:rgba(255,197,61,.12); }

  // Iconos de ítems MUE (24x24)
  const IC = {

  /* ============================ HUD ============================ */
  function pintarHUD(anim) {
    const v = clamp(estado.indicador);
    const nv = nivel(estado.xp);
    const xpEn = estado.xp % 100;
    hud.innerHTML = `
      <div class="hud-btns">
        <button id="btn-home" class="hud-menu" title="Menú principal">🏠</button>
        <button id="btn-menu" class="hud-menu" title="Reiniciar">↻</button>

        <div class="hud-avatar">${rivas(40)}</div>

        </div>
      </div>
      <div class="hud-score ${v>=65?"ok":v>=40?"med":"bajo"}">

        <div class="hud-score-txt"><b id="score-num">${v}</b><small>Seguridad</small></div>
      </div>`;
    document.getElementById("btn-menu").onclick = reiniciar;
    document.getElementById("btn-home").onclick = () => { if (onHome) onHome(); };
    if (anim && !reduce) requestAnimationFrame(() => {
      const f = hud.querySelector(".hud-xpfill"); if (f) f.style.width = xpEn + "%";
    });
  }

  function ganar(indDelta, xpDelta) {
    const scoreEl = document.getElementById("score-num");
    const antes = clamp(estado.indicador);
    estado.indicador = clamp(estado.indicador + (indDelta || 0));
    estado.xp += (xpDelta || 0);
    guardar();
    if (scoreEl && !reduce) animarNumero(scoreEl, antes, clamp(estado.indicador), 600);
    else if (scoreEl) scoreEl.textContent = clamp(estado.indicador);
    // repintar barra xp/nivel y clase de color
    const nvBefore = hud.querySelector(".hud-nivel-top span");
    pintarHUD(false);
    if (xpDelta) flotante("+" + xpDelta + " XP");
  }

  function animarNumero(el, a, b, ms) {
    const t0 = performance.now();
    (function step(t) {
      const k = Math.min(1, (t - t0) / ms);
      el.textContent = Math.round(a + (b - a) * (1 - Math.pow(1 - k, 3)));
      if (k < 1) requestAnimationFrame(step);
    })(t0);
  }

  function flotante(txt) {
    const el = document.createElement("div");
    el.className = "flotante-xp"; el.textContent = txt;
    hud.appendChild(el);
    setTimeout(() => el.remove(), 1200);
  }

  /* ============================ NAVEGACIÓN ============================ */
  // Resuelve un "siguiente" que puede ser string o función(estado) => id.
  // Es la base de la narrativa ramificada y de las consecuencias diferidas.
  const sig = (v) => (typeof v === "function" ? v(estado) : v);
  const ir = (id) => { estado.nodo = sig(id); guardar(); render(); };

  function render() {
    const nodo = cap.nodos[estado.nodo];
    if (nodo.tipo === "portada") { hud.style.display = "none"; }
    else { hud.style.display = "flex"; pintarHUD(!estado.mostrado[estado.nodo]); }
    estado.mostrado[estado.nodo] = true;
    app.scrollTop = 0;
    ({ portada: rPortada, escena: rEscena, decision: rDecision, seleccion: rSeleccion,
       evaluacion: rEvaluacion, final: rFinal }[nodo.tipo] || rEscena)(nodo);
  }

  function bloqueDialogo(personaId, texto, chico) {
    if (!texto) return "";
    const p = persona(personaId);
    return `<div class="dialogo ${chico ? "chico" : ""}">
      <div class="dialogo-av">${rivas(chico ? 44 : 54)}</div>
      <div class="dialogo-cuerpo">
        <div class="dialogo-nombre">${esc(p ? p.nombre : "")}<span>${esc(p ? p.rol : "")}</span></div>
        <div class="dialogo-texto">${esc(texto)}</div>

  }

  const card = (inner, cls) => `<div class="card ${cls || ""}">${inner}</div>`;
  const chipPaso = (nodo) => nodo.paso ? `<div class="chip-paso">${esc(nodo.paso)}</div>` : "";

  /* ------------------------------- PORTADA ------------------------------- */

        </div>

    document.getElementById("jugar").onclick = () => ir(nodo.siguiente);

  /* ------------------------------- ESCENA ------------------------------- */
  function rEscena(nodo) {
    app.innerHTML =

  /* ------------------------------ DECISIÓN ------------------------------ */
  function rDecision(nodo) {
    app.innerHTML =
      chipPaso(nodo) +
      card(
        (nodo.ilustracion ? escena(nodo.ilustracion) : "") +
        `<div class="card-pad"><h2>${esc(nodo.titulo)}</h2>

    app.querySelectorAll(".opcion").forEach((b) => {
      b.onclick = () => {
        const op = nodo.opciones[+b.dataset.i];
        ganar(op.indicador, op.xp);
        if (op.bandera) estado.banderas[op.bandera] = true;
        guardar();
        app.querySelectorAll(".opcion").forEach((x) => { x.disabled = true; x.classList.add("inerte"); });

        b.classList.add(op.correcta ? "elegida-ok" : "elegida-mal");
        const fb = document.createElement("div");
        fb.className = "feedback " + (op.correcta ? "fb-ok" : "fb-mal");
        fb.innerHTML =
          `<div class="fb-cab">${op.correcta ? "✓ Bien pensado" : "◆ Reflexiona"}${op.indicador ? `<span class="fb-delta">${op.indicador > 0 ? "▲ +" : "▼ "}${op.indicador}</span>` : ""}</div>
           <p>${esc(op.feedback)}</p>
           <button class="btn primario" id="seguir">Continuar <span>▸</span></button>`;
        app.appendChild(fb);
        fb.scrollIntoView({ behavior: reduce ? "auto" : "smooth", block: "nearest" });
        // RAMIFICACIÓN: cada opción define su propio camino (o cae al del nodo).
        const destino = op.siguiente != null ? op.siguiente : nodo.siguiente;
        document.getElementById("seguir").onclick = () => ir(destino);
      };
    });
  }

  /* ------------------------------ SELECCIÓN ----------------------------- */
  function rSeleccion(nodo) {
    app.innerHTML =
      chipPaso(nodo) +
      card(`<div class="card-pad"><h2>${esc(nodo.titulo)}</h2><p class="cuerpo">${esc(nodo.cuerpo)}</p></div>`) +
      `<div class="items">${nodo.items.map((it, i) =>
        `<label class="item" data-i="${i}">
           <span class="item-ic">${icono(it.icono)}</span>
           <span class="item-txt">${esc(it.texto)}</span>
           <span class="item-check"></span>
           <input type="checkbox" data-i="${i}" hidden>
         </label>`).join("")}</div>
      <button class="btn primario" id="verificar">Verificar selección</button>`;

    app.querySelectorAll(".item").forEach((l) => {
      l.onclick = (e) => {
        if (l.classList.contains("bloq")) return;
        const cb = l.querySelector("input");
        cb.checked = !cb.checked;
        l.classList.toggle("marcado", cb.checked);
        e.preventDefault();
      };
    });

    document.getElementById("verificar").onclick = () => {
      let correctas = 0;
      nodo.items.forEach((it, i) => {
        const l = app.querySelector(`.item[data-i="${i}"]`);
        const marcado = l.querySelector("input").checked;
        const acierto = marcado === !!it.esMUE;
        if (acierto) correctas++;
        l.classList.add("bloq", acierto ? "item-ok" : "item-mal");
        const nota = document.createElement("div");
        nota.className = "item-nota " + (it.esMUE ? "es-mue" : "no-mue");
        nota.innerHTML = `<b>${it.esMUE ? "★ MUE" : "○ No es MUE"}</b> — ${esc(it.nota)}`;
        l.appendChild(nota);
      });
      const aprob = correctas >= nodo.minCorrectas;
      ganar(aprob ? 14 : -6, correctas * 6);
      const btn = document.getElementById("verificar"); btn.style.display = "none";
      const fb = document.createElement("div");
      fb.className = "feedback " + (aprob ? "fb-ok" : "fb-mal");
      fb.innerHTML =
        `<div class="fb-cab">${correctas} / ${nodo.items.length} correctas ${aprob ? "✓" : ""}</div>
         <p>${esc(aprob ? nodo.feedbackAlto : nodo.feedbackBajo)}</p>
         <button class="btn primario" id="seguir">Continuar <span>▸</span></button>`;
      app.appendChild(fb);
      fb.scrollIntoView({ behavior: reduce ? "auto" : "smooth", block: "nearest" });
      document.getElementById("seguir").onclick = () => ir(nodo.siguiente);
    };
  }

  /* ------------------------------ EVALUACIÓN ---------------------------- */
  function rEvaluacion(nodo) {
    app.innerHTML =
      card((nodo.ilustracion ? escena(nodo.ilustracion) : "") +
        `<div class="card-pad"><div class="quiz-badge">EVALUACIÓN</div><h2>${esc(nodo.titulo)}</h2>
         <p class="cuerpo">${esc(nodo.cuerpo)}</p></div>`, nodo.ilustracion ? "con-escena" : "") +
      `<div class="opciones">${nodo.opciones.map((op, i) =>
        `<button class="btn opcion" data-i="${i}"><span class="op-letra">${String.fromCharCode(65 + i)}</span><span>${esc(op.texto)}</span></button>`).join("")}</div>`;

    app.querySelectorAll(".opcion").forEach((b) => {
      b.onclick = () => {
        const op = nodo.opciones[+b.dataset.i];
        estado.totalEval++;
        if (op.correcta) { estado.aciertosEval++; ganar(6, 25); } else { ganar(-4, 0); }
        guardar();
        app.querySelectorAll(".opcion").forEach((x, i) => {
          x.disabled = true; x.classList.add("inerte");
          if (nodo.opciones[i].correcta) { x.classList.remove("inerte"); x.classList.add("elegida-ok"); }
        });
        if (!op.correcta) b.classList.add("elegida-mal");
        const fb = document.createElement("div");
        fb.className = "feedback " + (op.correcta ? "fb-ok" : "fb-mal");
        fb.innerHTML = `<div class="fb-cab">${op.correcta ? "✓ Correcto" : "✗ Incorrecto"}</div>
          <p>${esc(op.correcta ? nodo.feedbackOk : nodo.feedbackNo)}</p>
          <button class="btn primario" id="seguir">Continuar <span>▸</span></button>`;
        app.appendChild(fb);
        fb.scrollIntoView({ behavior: reduce ? "auto" : "smooth", block: "nearest" });
        document.getElementById("seguir").onclick = () => ir(nodo.siguiente);
      };
    });
  }

  /* -------------------------------- FINAL ------------------------------- */
  // Tres variantes de desenlace según el camino tomado: exito | mixto | fallo.
  const HEROES = {
    exito: { col: "#2DD4BF", ico: `<path d="M28 46 l8 9 l18 -22" stroke="#2DD4BF" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>` },

    fallo: { col: "#FF5A5F", ico: `<path d="M31 37 l18 18 M49 37 l-18 18" stroke="#FF5A5F" stroke-width="6" fill="none" stroke-linecap="round"/>` }
  };
  function rFinal(nodo) {
    const v = clamp(estado.indicador);
    const variante = nodo.variante || "exito";
    const h = HEROES[variante] || HEROES.exito;
    const celebra = variante === "exito";
    app.innerHTML = card(`
      <div class="final-hero var-${variante}">
        <div class="final-glow" style="background:radial-gradient(circle, ${h.col}66, transparent 65%)"></div>
        <svg viewBox="0 0 80 92" width="104" height="120" class="final-escudo">
          <path d="M40 3 L74 16 V40 Q74 74 40 89 Q6 74 6 40 V16z" fill="#141C2E" stroke="${h.col}" stroke-width="3"/>
          ${h.ico}
        </svg>
      </div>
      <div class="card-pad">
        <h2 style="text-align:center">${esc(nodo.titulo)}</h2>
        <div class="resultado">
          <div class="metrica"><b>${v}</b><small>Seguridad</small></div>
          <div class="metrica"><b>Nv ${nivel(estado.xp)}</b><small>Nivel</small></div>
          <div class="metrica"><b>${estado.xp}</b><small>XP total</small></div>
        </div>
        ${nodo.insignia ? `<div class="insignia"><span class="ins-medalla">🏅</span> Insignia obtenida<b>${esc(nodo.insignia)}</b></div>` : ""}
        <p class="cuerpo">${esc(nodo.cuerpo)}</p>
        ${bloqueDialogo(nodo.persona, nodo.dialogo)}
      </div>`, "con-escena") +
      `<button class="btn primario" id="reiniciar-final">${variante === "fallo" ? "Reintentar el capítulo" : "Volver a jugar"}</button>
       <button class="btn" id="volver-menu">Volver al menú principal</button>`;
    // Reinicio directo y garantizado (sin confirm() nativo, que el hosting bloquea).
    document.getElementById("reiniciar-final").onclick = reiniciarDirecto;
    document.getElementById("volver-menu").onclick = () => { if (onHome) onHome(); };
    if (celebra && !reduce) confeti();
  }

  /* ------------------------------ CONFETI ------------------------------- */
  function confeti() {
    const cv = document.createElement("canvas");
    cv.className = "confeti"; app.appendChild(cv);
    const ctx = cv.getContext("2d");
    const w = cv.width = app.clientWidth, h = cv.height = app.clientHeight;
    const cols = ["#FFC24B", "#FF6B1A", "#2DD4BF", "#9B7BFF", "#EAF0FA"];
    const P = Array.from({ length: 90 }, () => ({
      x: Math.random() * w, y: -20 - Math.random() * h * 0.4,
      s: 4 + Math.random() * 5, vy: 2 + Math.random() * 3, vx: -1 + Math.random() * 2,
      c: cols[(Math.random() * cols.length) | 0], r: Math.random() * 6, vr: -0.2 + Math.random() * 0.4
    }));
    let t = 0;
    (function loop() {
      t++; ctx.clearRect(0, 0, w, h);
      P.forEach((p) => {
        p.x += p.vx; p.y += p.vy; p.r += p.vr;
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r);
        ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * 1.6); ctx.restore();
      });
      if (t < 180) requestAnimationFrame(loop); else cv.remove();
    })();
  }

  function reiniciarDirecto() {
    try { localStorage.removeItem(CLAVE); } catch (e) {}
    estado = nuevoEstado(); guardar(); render();
  }

  // Diálogo de confirmación propio (no usamos confirm() nativo: el iframe del
  // hosting lo bloquea, por eso antes el botón "no hacía nada").
  function reiniciar() {
    const ov = document.createElement("div");
    ov.className = "modal-ov";
    ov.innerHTML = `<div class="modal">
        <h3>¿Reiniciar el capítulo?</h3>
        <p>Perderás el progreso y las decisiones de esta partida.</p>
        <div class="modal-btns">
          <button class="btn" id="m-no">Cancelar</button>
          <button class="btn primario" id="m-si">Reiniciar</button>
        </div></div>`;
    document.querySelector(".telefono").appendChild(ov);
    requestAnimationFrame(() => ov.classList.add("visible"));
    const cerrar = () => ov.remove();
    ov.addEventListener("click", (e) => { if (e.target === ov) cerrar(); });
    ov.querySelector("#m-no").onclick = cerrar;
    ov.querySelector("#m-si").onclick = () => { cerrar(); reiniciarDirecto(); };
  }

  render();
}
window.MotorA = { iniciar: iniciarMotorA };

</script>

  const escena = (id) => `<div class="escena">${(S[id] || S.sala)()}<div class="escena-fade"></div></div>`;

  /* ============================ HUD ============================ */
  function pintarHUD() {
    const v = clamp(estado.indicador);
    const nv = nivel(estado.xp), xpEn = estado.xp % 100;
    const cod = [1, 2, 3].map((c) => estado.digitos[c] || "·").join(" ");
    hud.innerHTML = `
      <div class="hud-btns">
        <button id="btn-home" class="hud-menu" title="Menú principal">🏠</button>

  function ganar(indDelta, xpDelta) {
    estado.indicador = clamp(estado.indicador + (indDelta || 0));
    estado.xp += (xpDelta || 0);
    guardar(); pintarHUD();
    if (xpDelta) flotante("+" + xpDelta + " XP");
  }
  function flotante(txt) {
    const el = document.createElement("div"); el.className = "flotante-xp"; el.textContent = txt;
    hud.appendChild(el); setTimeout(() => el.remove(), 1200);
  }
  function revelarDigito(candado, d) {
    estado.digitos[candado] = d; guardar(); pintarHUD();
  }

  /* ============================ NAV ============================ */
  const sig = (v) => (typeof v === "function" ? v(estado) : v);
  const ir = (id) => { estado.nodo = sig(id); guardar(); render(); };

  function render() {
    const nodo = cap.nodos[estado.nodo];
    if (nodo.tipo === "portada") hud.style.display = "none"; else { hud.style.display = "flex"; pintarHUD(); }
    estado.mostrado[estado.nodo] = true; app.scrollTop = 0;
    ({ portada: rPortada, escena: rEscena, sorteo: rSorteo, filtro: rFiltro,
       codigo: rCodigo, teclado: rTeclado, final: rFinal }[nodo.tipo] || rEscena)(nodo);
  }

  function bloqueDialogo(personaId, texto) {

    const p = persona(personaId);
    return `<div class="dialogo"><div class="dialogo-av">${rivas(54)}</div>

  const card = (inner, cls) => `<div class="card ${cls || ""}">${inner}</div>`;
  const chipCandado = (n) => n ? `<div class="chip-paso">🔒 Candado ${n} de 3</div>` : "";
  const cabecera = (nodo) => `<div class="card-pad"><h2>${esc(nodo.titulo)}</h2>${nodo.cuerpo ? `<p class="cuerpo">${esc(nodo.cuerpo)}</p>` : ""}</div>`;

  /* ===================== MECÁNICA 1 · SORTEO (BOWTIE) ==================== */
  function rSorteo(nodo) {
    // pos[i] = id de zona o null (bandeja). sel = índice seleccionado.
    const pos = nodo.cartas.map(() => null);
    let sel = null, resuelto = false;

    function pintar() {
      const bandeja = nodo.cartas.map((c, i) => pos[i] == null
        ? `<button class="carta ${sel === i ? "sel" : ""}" data-i="${i}">${esc(c.t)}</button>` : "").join("");
      const zonaHTML = (z) => {
        const dentro = nodo.cartas.map((c, i) => pos[i] === z.id
          ? `<button class="carta puesta ${resuelto ? (c.z === z.id ? "ok" : "mal") : ""}" data-i="${i}">${esc(c.t)}</button>` : "").join("");
        return `<div class="zona" data-z="${z.id}" style="--zc:${z.color}">
          <div class="zona-cab"><b>${esc(z.nombre)}</b><small>${esc(z.sub)}</small></div>
          <div class="zona-body">${dentro || `<span class="zona-vacia">Toca aquí para colocar</span>`}</div></div>`;
      };
      const faltan = pos.filter((p) => p == null).length;
      app.innerHTML = chipCandado(nodo.candado) + card(
        cabecera({ titulo: nodo.titulo, cuerpo: null }) +
        `<div class="card-pad" style="padding-top:0">
          <div class="evento-chip">⚠ EVENTO · ${esc(nodo.evento)}</div>
          ${sel != null ? `<div class="sorteo-hint">Ahora toca un lado para colocar el control seleccionado.</div>` : `<div class="sorteo-hint tenue">Toca un control de la bandeja para seleccionarlo.</div>`}
          <div class="bandeja">${bandeja || `<span class="zona-vacia">Todos los controles colocados</span>`}</div>
          <div class="zonas">${nodo.zonas.map(zonaHTML).join("")}</div>
        </div>`, "") +
        `<button class="btn primario" id="verificar" ${faltan ? "disabled" : ""}>Verificar bowtie</button>`;

      app.querySelectorAll(".bandeja .carta").forEach((b) => b.onclick = () => {
        sel = sel === +b.dataset.i ? null : +b.dataset.i; pintar();
      });
      app.querySelectorAll(".zona").forEach((zEl) => zEl.onclick = () => {
        if (resuelto) return;
        if (sel != null) { pos[sel] = zEl.dataset.z; sel = null; pintar(); }
      });
      app.querySelectorAll(".zona .carta.puesta").forEach((b) => b.onclick = (e) => {
        if (resuelto) return;
        // Si hay una carta seleccionada, tocar aquí la COLOCA en esta zona
        // (en vez de quitar la que ya está). Sin selección, quita esta carta.
        if (sel != null) { pos[sel] = b.closest(".zona").dataset.z; sel = null; e.stopPropagation(); pintar(); return; }
        e.stopPropagation();
        pos[+b.dataset.i] = null; pintar();
      });
      const vb = document.getElementById("verificar");
      if (vb) vb.onclick = verificar;
    }

    function verificar() {
      const bien = nodo.cartas.every((c, i) => pos[i] === c.z);
      if (!bien) {
        resuelto = true; pintar(); resuelto = false; // pinta ok/mal un instante
        setTimeout(() => {
          const fb = document.createElement("div");
          fb.className = "feedback fb-mal";
          fb.innerHTML = `<div class="fb-cab">Aún no calza</div><p>${esc(nodo.error)}</p><button class="btn primario" id="reintentar">Ajustar</button>`;
          app.appendChild(fb); fb.scrollIntoView({ behavior: reduce ? "auto" : "smooth", block: "nearest" });
          document.getElementById("reintentar").onclick = pintar;
        }, 400);
        ganar(-4, 0);
        return;
      }
      resuelto = true; pintar();
      revelarDigito(nodo.candado, nodo.digito); ganar(10, 30);
      exitoCandado(nodo);
    }
    pintar();
  }

  /* ==================== MECÁNICA 2 · FILTRO (CRÍTICOS) =================== */
  function rFiltro(nodo) {
    const cand = barajar(nodo.candidatos.map((c, i) => ({ ...c, i })));
    const slots = Array(nodo.ranuras).fill(null);
    const usados = {};

    function pintar(msg, tipo) {
      const slotHTML = slots.map((s) =>
        s == null ? `<div class="slot vacio">RANURA<br>CRÍTICA</div>`
                  : `<div class="slot lleno">🛡️<span>${esc(s.t)}</span></div>`).join("");
      const candHTML = cand.map((c) => usados[c.i]
        ? `<button class="cand usado" disabled>${esc(c.t)}</button>`
        : `<button class="cand" data-i="${c.i}">${esc(c.t)}</button>`).join("");
      app.innerHTML = chipCandado(nodo.candado) + card(
        cabecera({ titulo: nodo.titulo, cuerpo: null }) +
        `<div class="card-pad" style="padding-top:0">
          <div class="slots">${slotHTML}</div>
          <div class="filtro-lbl">Controles disponibles · toca para pasarlos por el filtro</div>
          <div class="cands">${candHTML}</div>
          <div class="filtro-msg ${tipo || ""}">${msg || "Solo 3 controles cumplen los criterios ICMM de criticidad."}</div>
        </div>`, "");
      app.querySelectorAll(".cand:not(.usado)").forEach((b) => b.onclick = () => intentar(+b.dataset.i));
    }

    function intentar(i) {
      const c = nodo.candidatos[i];
      if (c.critico) {
        const idx = slots.indexOf(null);
        if (idx === -1) return;
        slots[idx] = c; usados[i] = true; ganar(4, 12);
        if (slots.every((s) => s)) { pintar(nodo.exito, "ok"); revelarDigito(nodo.candado, nodo.digito); ganar(8, 20); exitoCandado(nodo); }
        else pintar("✓ Control crítico aislado. " + c.motivo, "ok");
      } else {
        ganar(-3, 0);
        pintar("✗ Rechazado. " + c.motivo, "mal");
        const el = app.querySelector(`.cand[data-i="${i}"]`);
        if (el) { el.classList.add("rechazado"); setTimeout(() => el.classList.remove("rechazado"), 500); }
      }
    }
    pintar();
  }

  /* =================== MECÁNICA 3 · CÓDIGO (DEFINICIÓN) ================== */
  function rCodigo(nodo) {
    const fichas = barajar(nodo.fichas.slice());
    const puestas = nodo.respuestas.map(() => null); // palabra por hueco
    let resuelto = false;

    function pintar(err) {
      let h = 0;
      const fraseHTML = nodo.frase.map((tr) => {
        if (typeof tr === "string") return esc(tr);
        const idx = tr.hueco;
        const val = puestas[idx];
        return `<button class="hueco ${val ? "lleno" : ""} ${resuelto ? (val === nodo.respuestas[idx] ? "ok" : "mal") : ""}" data-h="${idx}">${val ? esc(val) : "＿＿"}</button>`;
      }).join("");
      const fichaHTML = fichas.map((f, i) =>
        puestas.indexOf(f) >= 0 ? `<button class="ficha usada" disabled>${esc(f)}</button>`
        : `<button class="ficha" data-f="${i}">${esc(f)}</button>`).join("");
      const completo = puestas.every((p) => p != null);
      app.innerHTML = chipCandado(nodo.candado) + card(
        cabecera({ titulo: nodo.titulo, cuerpo: null }) +
        `<div class="card-pad" style="padding-top:0">
          <div class="frase">${fraseHTML}</div>
          <div class="fichas-lbl">Fichas · toca para colocar en el hueco</div>
          <div class="fichas">${fichaHTML}</div>
          ${err ? `<div class="filtro-msg mal">${esc(nodo.error)}</div>` : ""}
        </div>`, "") +
        `<button class="btn primario" id="sellar" ${completo ? "" : "disabled"}>Sellar la definición</button>`;
      app.querySelectorAll(".ficha:not(.usada)").forEach((b) => b.onclick = () => {
        const idx = puestas.indexOf(null); if (idx === -1) return;
        puestas[idx] = fichas[+b.dataset.f]; pintar();
      });
      app.querySelectorAll(".hueco.lleno").forEach((b) => b.onclick = () => { puestas[+b.dataset.h] = null; pintar(); });
      const sb = document.getElementById("sellar");
      if (sb) sb.onclick = () => {
        const bien = puestas.every((p, i) => p === nodo.respuestas[i]);
        if (!bien) { ganar(-4, 0); pintar(true); return; }
        resuelto = true; pintar(); revelarDigito(nodo.candado, nodo.digito); ganar(10, 30); exitoCandado(nodo);
      };
    }
    pintar();
  }

  /* ==================== ÉXITO DE CANDADO (transición) =================== */
  function exitoCandado(nodo) {
    setTimeout(() => {
      const fb = document.createElement("div");
      fb.className = "feedback fb-ok candado-ok";
      fb.innerHTML =

      document.getElementById("seguir").onclick = () => ir(nodo.siguiente);

  /* ===================== MECÁNICA 4 · TECLADO (PUERTA) ================== */
  function rTeclado(nodo) {
    let entrada = "";
    function pintar(estadoMsg) {
      const cod = [1, 2, 3].map((c) => estado.digitos[c] || "?").join("");
      const disp = (entrada + "___").slice(0, 3).split("").map((ch) =>
        `<span class="disp-dig ${ch !== "_" ? "on" : ""}">${ch === "_" ? "" : ch}</span>`).join("");
      app.innerHTML = card(
        `<div class="escena">${S.sala()}<div class="escena-fade"></div></div>` +
        `<div class="card-pad"><h2>${esc(nodo.titulo)}</h2><p class="cuerpo">${esc(nodo.cuerpo)}</p>
          <div class="pista-cod">Dígitos revelados: <b>${esc(cod)}</b></div>
          <div class="display">${disp}</div>
          <div class="teclado">
            ${[1,2,3,4,5,6,7,8,9].map((n) => `<button class="tecla" data-n="${n}">${n}</button>`).join("")}
            <button class="tecla borrar" data-a="clear">✕</button>
            <button class="tecla" data-n="0">0</button>
            <button class="tecla ok" data-a="enter">▸</button>
          </div>
          ${estadoMsg ? `<div class="filtro-msg mal">${esc(estadoMsg)}</div>` : ""}
        </div>`, "con-escena");
      app.querySelectorAll(".tecla[data-n]").forEach((b) => b.onclick = () => {
        if (entrada.length < 3) { entrada += b.dataset.n; pintar(); }
      });
      app.querySelector('[data-a="clear"]').onclick = () => { entrada = ""; pintar(); };
      app.querySelector('[data-a="enter"]').onclick = () => {
        if (entrada.length < 3) return;
        if (entrada === nodo.codigo) { ganar(10, 25); ir(nodo.siguiente); }
        else { ganar(-4, 0); const d = app.querySelector(".display"); if (d && !reduce) { d.classList.add("shake"); } entrada = ""; setTimeout(() => pintar(nodo.error), 300); }
      };
    }
    pintar();
  }

  /* -------------------------------- FINAL ------------------------------- */
  function rFinal(nodo) {
    const v = clamp(estado.indicador);
    app.innerHTML = card(
      escena(nodo.ilustracion) +
      `<div class="card-pad">
        <h2 style="text-align:center">${esc(nodo.titulo)}</h2>

          <div class="metrica"><b>${estado.xp}</b><small>XP total</small></div>
        </div>
        ${nodo.insignia ? `<div class="insignia"><span class="ins-medalla">🏅</span> Insignia obtenida<b>${esc(nodo.insignia)}</b></div>` : ""}
        <p class="cuerpo">${esc(nodo.cuerpo)}</p>
        ${bloqueDialogo(nodo.persona, nodo.dialogo)}
      </div>`, "con-escena") +
      `<button class="btn primario" id="reiniciar-final">Volver a jugar</button>
       <button class="btn" id="volver-menu">Volver al menú principal</button>`;
    document.getElementById("reiniciar-final").onclick = reiniciarDirecto;
    document.getElementById("volver-menu").onclick = () => { if (onHome) onHome(); };
    if (!reduce) confeti();
  }

  /* ------------------------------ CONFETI ------------------------------- */
  function confeti() {
    const cv = document.createElement("canvas"); cv.className = "confeti"; app.appendChild(cv);
    const ctx = cv.getContext("2d");
    const w = cv.width = app.clientWidth, h = cv.height = app.clientHeight;
    const cols = ["#FFC24B", "#FF6B1A", "#2DD4BF", "#9B7BFF", "#EAF0FA"];
    const P = Array.from({ length: 90 }, () => ({
      x: Math.random() * w, y: -20 - Math.random() * h * 0.4, s: 4 + Math.random() * 5,
      vy: 2 + Math.random() * 3, vx: -1 + Math.random() * 2, c: cols[(Math.random() * cols.length) | 0],
      r: Math.random() * 6, vr: -0.2 + Math.random() * 0.4
    }));
    let t = 0;
    (function loop() {
      t++; ctx.clearRect(0, 0, w, h);
      P.forEach((p) => { p.x += p.vx; p.y += p.vy; p.r += p.vr;
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c;
        ctx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * 1.6); ctx.restore(); });
      if (t < 180) requestAnimationFrame(loop); else cv.remove();
    })();
  }

  /* ------------------------------ RESET ------------------------------- */
  function reiniciarDirecto() { try { localStorage.removeItem(CLAVE); } catch (e) {} estado = nuevoEstado(); guardar(); render(); }
  function reiniciar() {
    const ov = document.createElement("div"); ov.className = "modal-ov";
    ov.innerHTML = `<div class="modal"><h3>¿Reiniciar el capítulo?</h3>
      <p>Perderás el progreso de esta partida.</p>
      <div class="modal-btns"><button class="btn" id="m-no">Cancelar</button>
      <button class="btn primario" id="m-si">Reiniciar</button></div></div>`;
    document.querySelector(".telefono").appendChild(ov);
    requestAnimationFrame(() => ov.classList.add("visible"));

          <span class="ctrl-d ${d ? "puesto" : ""}">${d ? "👤 " + esc(nombreDueno(d)) : "sin dueño — toca para asignar"}</span></button>`;
      }).join("");
      const rosterHTML = nodo.duenos.map((d) =>
        `<button class="persona ${sel ? "activo" : ""}" data-d="${d.id}"><b>${esc(d.nombre)}</b><small>${esc(d.nivel)}</small></button>`).join("");
      const completo = nodo.controles.every((c) => asign[c.id]);
      app.innerHTML = chipPaso("Paso 6 · Asignar dueños") + card(
        cabecera({ titulo: nodo.titulo, cuerpo: null }) +
        `<div class="card-pad" style="padding-top:0">
          <div class="ctrl-list">${ctrlHTML}</div>
          <div class="roster-lbl">${sel ? "Ahora toca el dueño para «" + esc(nodo.controles.find((c) => c.id === sel).t) + "»" : "Toca un control para asignarle dueño"}</div>
          <div class="roster">${rosterHTML}</div>
        </div>`, "") +
        `<button class="btn primario" id="verificar" ${completo ? "" : "disabled"}>Verificar asignaciones</button>`;

      app.querySelectorAll(".ctrl-card").forEach((b) => b.onclick = () => {
        if (resuelto) return; const id = b.dataset.c;
        if (asign[id]) { delete asign[id]; sel = null; } else { sel = sel === id ? null : id; }
        pintar();
      });
      app.querySelectorAll(".persona").forEach((b) => b.onclick = () => {
        if (resuelto || !sel) return; asign[sel] = b.dataset.d; sel = null; pintar();
      });
      const vb = document.getElementById("verificar"); if (vb) vb.onclick = verificar;
    }

    function verificar() {
      const bien = nodo.controles.every((c) => asign[c.id] === c.dueno);
      resuelto = true; pintar();
      if (!bien) {
        resuelto = false; ganar(-4, 0);
        setTimeout(() => {
          const fb = document.createElement("div"); fb.className = "feedback fb-mal";
          fb.innerHTML = `<div class="fb-cab">Revisa los dueños</div><p>${esc(nodo.motivoMal)}</p><button class="btn primario" id="reintentar">Ajustar</button>`;
          app.appendChild(fb); fb.scrollIntoView({ behavior: reduce ? "auto" : "smooth", block: "nearest" });
          document.getElementById("reintentar").onclick = () => { nodo.controles.forEach((c) => { if (asign[c.id] !== c.dueno) delete asign[c.id]; }); pintar(); };
        }, 350);
        return;
      }
      ganar(10, 30);
      setTimeout(() => {
        const fb = document.createElement("div"); fb.className = "feedback fb-ok";
        fb.innerHTML = `<div class="fb-cab">✓ Dueños asignados</div><p>${esc(nodo.exito)}</p><button class="btn primario" id="seguir">Continuar <span>▸</span></button>`;
        app.appendChild(fb); fb.scrollIntoView({ behavior: reduce ? "auto" : "smooth", block: "nearest" });
        document.getElementById("seguir").onclick = () => ir(nodo.siguiente);
      }, 350);
    }
    pintar();
  }

  /* ===================== MECÁNICA 2 · ESTÁNDARES (SLIDERS) ============== */
  function rEstandar(nodo) {
    const val = {}; nodo.controles.forEach((c) => (val[c.id] = 1));
    let resuelto = false;

    function pintar() {
      const filas = nodo.controles.map((c) => {
        const cls = resuelto ? (val[c.id] === c.target ? "ok" : "mal") : "";
        return `<div class="std-fila ${cls}">
          <div class="std-top"><b>${esc(c.t)}</b><span class="std-val">${esc(nodo.escala[val[c.id]])}</span></div>
          <input type="range" min="0" max="${nodo.escala.length - 1}" step="1" value="${val[c.id]}" data-c="${c.id}" class="slider">
          <div class="std-escala">${nodo.escala.map((e) => `<span>${esc(e)}</span>`).join("")}</div>
          ${resuelto ? `<div class="std-nota ${val[c.id] === c.target ? "ok" : "mal"}">${val[c.id] === c.target ? "✓ " : "✗ "}${esc(c.nota)}</div>` : ""}
        </div>`;
      }).join("");
      app.innerHTML = chipPaso("Paso 5 · Estándar de verificación") + card(
        cabecera({ titulo: nodo.titulo, cuerpo: null }) +
        `<div class="card-pad" style="padding-top:0"><div class="std-list">${filas}</div></div>`, "") +
        `<button class="btn primario" id="confirmar">Confirmar estándares</button>`;
      app.querySelectorAll(".slider").forEach((s) => s.oninput = () => {
        if (resuelto) return; val[s.dataset.c] = +s.value;
        s.closest(".std-fila").querySelector(".std-val").textContent = nodo.escala[+s.value];
      });
      document.getElementById("confirmar").onclick = confirmar;
    }

    function confirmar() {
      const bien = nodo.controles.every((c) => val[c.id] === c.target);
      resuelto = true; pintar();
      if (!bien) {
        resuelto = false; ganar(-4, 0);
        setTimeout(() => {
          const fb = document.createElement("div"); fb.className = "feedback fb-mal";
          fb.innerHTML = `<div class="fb-cab">Ajusta la frecuencia</div><p>Revisa las notas: cada control necesita una frecuencia acorde a cómo puede fallar.</p><button class="btn primario" id="reintentar">Ajustar</button>`;
          app.appendChild(fb); fb.scrollIntoView({ behavior: reduce ? "auto" : "smooth", block: "nearest" });
          document.getElementById("reintentar").onclick = pintar;
        }, 350);
        return;
      }
      ganar(10, 30);
      setTimeout(() => {
        const fb = document.createElement("div"); fb.className = "feedback fb-ok";
        fb.innerHTML = `<div class="fb-cab">✓ Estándares definidos</div><p>${esc(nodo.exito)}</p><button class="btn primario" id="seguir">Continuar <span>▸</span></button>`;
        app.appendChild(fb); fb.scrollIntoView({ behavior: reduce ? "auto" : "smooth", block: "nearest" });
        document.getElementById("seguir").onclick = () => ir(nodo.siguiente);
      }, 350);
    }
    pintar();
  }

  /* ===================== MECÁNICA 3 · SIMULACIÓN DE TURNO =============== */
  // Se construye el tablero UNA vez y solo se actualizan las partes que cambian
  // en cada tick (barra de avance, estado de medidores y la alerta activa).
  function rTurno(nodo) {
    const ctr = nodo.controles.map((c) => ({ ...c, estado: "ok", tRestante: 0, txtAlerta: "" }));
    const DUR = Math.round((nodo.duracionSeg || 26) * 10); // ticks de 100ms
    let progreso = 0, resueltos = 0, incidentes = 0, activa = null, finalizado = false, alertaRender = "init";

    app.innerHTML = card(
      `<div class="card-pad">
        <div class="turno-cab"><h2 style="margin:0">${esc(nodo.titulo)}</h2><div class="turno-kpi">🛡 <b id="kpi-seg">${clamp(estado.indicador)}</b></div></div>
        <div class="turno-prog"><div class="turno-prog-fill" id="prog-fill"></div></div>
        <div class="turno-prog-lbl" id="prog-lbl"></div>
        <div class="gauges">${ctr.map((c, i) => `
          <div class="gauge est-ok" id="g-${i}">
            <div class="gauge-top"><b>${esc(c.t)}</b><span class="gauge-pill" id="p-${i}">OK</span></div>
            <div class="gauge-sub">${esc(c.dueno)}</div>
            <div class="gauge-bar"><div class="gauge-fill"></div></div>
          </div>`).join("")}</div>
        <div id="alerta-box"></div>
      </div>`, "");
    const progFill = document.getElementById("prog-fill");
    const progLbl = document.getElementById("prog-lbl");
    const kpi = document.getElementById("kpi-seg");
    const alertaBox = document.getElementById("alerta-box");

    function renderAlerta() {
      const clave = activa == null ? "vacia" : activa + "";
      if (clave === alertaRender) { // solo actualiza la barra de cuenta atrás
        if (activa != null) { const f = alertaBox.querySelector(".alerta-cd-fill"); if (f) f.style.width = (ctr[activa].tRestante / 50) * 100 + "%"; }
        return;
      }
      alertaRender = clave;
      if (activa == null) { alertaBox.innerHTML = `<div class="alerta vacia">Turno estable · vigila el tablero</div>`; return; }
      alertaBox.innerHTML = `<div class="alerta">
        <div class="alerta-txt"><b>⚠ ${esc(ctr[activa].txtAlerta)}</b><span>${esc(ctr[activa].t)} · ${esc(ctr[activa].dueno)}</span></div>
        <div class="alerta-cd"><div class="alerta-cd-fill" style="width:100%"></div></div>
        <button class="btn primario alerta-btn" data-a="responder">Responder</button></div>`;
      alertaBox.querySelector('[data-a="responder"]').onclick = responder;
    }
    function updateGauges() {
      ctr.forEach((c, i) => {
        const g = document.getElementById("g-" + i);
        const cls = "gauge est-" + c.estado;
        if (g.className !== cls) g.className = cls;
        const pill = document.getElementById("p-" + i);
        const txt = c.estado === "ok" ? "OK" : c.estado === "alerta" ? "ALERTA" : "FALLA";
        if (pill.textContent !== txt) pill.textContent = txt;
      });
    }
    function pintar() {
      const pct = Math.min(100, Math.round((progreso / DUR) * 100));
      progFill.style.width = pct + "%";
      progLbl.innerHTML = `Avance del turno · ${pct}% &nbsp;·&nbsp; Resueltas ${resueltos} &nbsp;·&nbsp; Fallas ${incidentes}`;
      kpi.textContent = clamp(estado.indicador);
      updateGauges(); renderAlerta();
    }

    function responder() {
      if (activa == null) return;
      ctr[activa].estado = "ok"; ctr[activa].tRestante = 0; activa = null; resueltos++;
      ganar(3, 10); pintar();
    }

    function tick() {
      if (finalizado) return;
      progreso++;
      if (activa == null && progreso % 24 === 0 && progreso < DUR - 12) {
        const sanos = ctr.map((c, i) => ({ c, i })).filter((o) => o.c.estado === "ok");
        if (sanos.length) {
          const o = sanos[(Math.random() * sanos.length) | 0];
          o.c.estado = "alerta"; o.c.tRestante = 50;
          o.c.txtAlerta = nodo.alertas[(Math.random() * nodo.alertas.length) | 0];
          activa = o.i;
        }
      }
      if (activa != null) {
        ctr[activa].tRestante--;
        if (ctr[activa].tRestante <= 0) { ctr[activa].estado = "falla"; incidentes++; ganar(-7, 0); activa = null; }
      }
      if (progreso >= DUR) { finalizado = true; clearInterval(simTimer); simTimer = null; return finTurno(); }
      pintar();
    }

    function finTurno() {
      const v = clamp(estado.indicador);
      app.innerHTML = card(
        `<div class="card-pad turno-fin">
          <div class="fin-ico ${incidentes === 0 ? "perfecto" : ""}">${incidentes === 0 ? "🏆" : "✅"}</div>
          <h2 style="text-align:center">Turno completado</h2>
          <div class="resultado">
            <div class="metrica"><b>${resueltos}</b><small>Alertas resueltas</small></div>
            <div class="metrica"><b>${incidentes}</b><small>Fallas</small></div>
            <div class="metrica"><b>${v}</b><small>Seguridad</small></div>
          </div>
          <p class="cuerpo">${incidentes === 0
            ? "Turno impecable: ningún control cayó en rojo. Así se ve un sistema de controles críticos vivo y verificado."
            : "Turno cerrado. Cada alerta ignorada fue un control crítico degradado: en la vida real, un evento a punto de escapar. Repite para afinar tu respuesta."}</p>
        </div>`, "") +
        `<button class="btn primario" id="seguir">Cerrar turno <span>▸</span></button>`;
      document.getElementById("seguir").onclick = () => ir(nodo.siguiente);
    }

    pintar();
    if (simTimer) clearInterval(simTimer);
    simTimer = setInterval(tick, 100);
  }

  /* -------------------------------- FINAL ------------------------------- */
  function rFinal(nodo) {
    const v = clamp(estado.indicador);
    app.innerHTML = card(
      escena(nodo.ilustracion) +
      `<div class="card-pad">
        <h2 style="text-align:center">${esc(nodo.titulo)}</h2>
        <div class="resultado">
          <div class="metrica"><b>${v}</b><small>Seguridad</small></div>
          <div class="metrica"><b>Nv ${nivel(estado.xp)}</b><small>Nivel</small></div>
          <div class="metrica"><b>${estado.xp}</b><small>XP total</small></div>
        </div>
        ${nodo.insignia ? `<div class="insignia"><span class="ins-medalla">🏅</span> Insignia obtenida<b>${esc(nodo.insignia)}</b></div>` : ""}
        <p class="cuerpo">${esc(nodo.cuerpo)}</p>
        ${bloqueDialogo(nodo.persona, nodo.dialogo)}
      </div>`, "con-escena") +
      `<button class="btn primario" id="reiniciar-final">Volver a jugar</button>
       <button class="btn" id="volver-menu">Volver al menú principal</button>`;
    document.getElementById("reiniciar-final").onclick = reiniciarDirecto;
    document.getElementById("volver-menu").onclick = () => { if (onHome) onHome(); };
    if (!reduce) confeti();
  }

  /* ------------------------------ CONFETI ------------------------------- */
  function confeti() {
    const cv = document.createElement("canvas"); cv.className = "confeti"; app.appendChild(cv);
    const ctx = cv.getContext("2d");
    const w = cv.width = app.clientWidth, h = cv.height = app.clientHeight;
    const cols = ["#FFC24B", "#FF6B1A", "#2DD4BF", "#9B7BFF", "#EAF0FA"];
    const P = Array.from({ length: 90 }, () => ({
      x: Math.random() * w, y: -20 - Math.random() * h * 0.4, s: 4 + Math.random() * 5,
      vy: 2 + Math.random() * 3, vx: -1 + Math.random() * 2, c: cols[(Math.random() * cols.length) | 0],
      r: Math.random() * 6, vr: -0.2 + Math.random() * 0.4
    }));
    let t = 0;
    (function loop() {
      t++; ctx.clearRect(0, 0, w, h);
      P.forEach((p) => { p.x += p.vx; p.y += p.vy; p.r += p.vr;
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c;
        ctx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * 1.6); ctx.restore(); });
      if (t < 180) requestAnimationFrame(loop); else cv.remove();
    })();
  }

  /* ------------------------------ RESET ------------------------------- */
  function reiniciarDirecto() { if (simTimer) { clearInterval(simTimer); simTimer = null; } try { localStorage.removeItem(CLAVE); } catch (e) {} estado = nuevoEstado(); guardar(); render(); }
  function reiniciar() {
    const ov = document.createElement("div"); ov.className = "modal-ov";
    ov.innerHTML = `<div class="modal"><h3>¿Reiniciar el capítulo?</h3><p>Perderás el progreso de esta partida.</p>
      <div class="modal-btns"><button class="btn" id="m-no">Cancelar</button><button class="btn primario" id="m-si">Reiniciar</button></div></div>`;
    document.querySelector(".telefono").appendChild(ov);
    requestAnimationFrame(() => ov.classList.add("visible"));
    const cerrar = () => ov.remove();
    ov.addEventListener("click", (e) => { if (e.target === ov) cerrar(); });
    ov.querySelector("#m-no").onclick = cerrar;
    ov.querySelector("#m-si").onclick = () => { cerrar(); reiniciarDirecto(); };
  }

  render();
}
window.MotorC = { iniciar: iniciarMotorC };

</script>
