<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --panel-2: #1c2330;
    --borde: #30363d;
    --texto: #e6edf3;
    --tenue: #9aa4b2;
    --azul: #1f6feb;
    --naranja: #f0883e;
    --verde: #2ea043;
    --rojo: #da3633;
    --amarillo: #d29922;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: #05070a; color: var(--texto);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { display: flex; justify-content: center; min-height: 100vh; }

  /* Marco tipo teléfono en pantallas anchas; ocupa todo en móvil */
  .telefono {
    width: 100%; max-width: 430px; min-height: 100vh;
    background: var(--bg); display: flex; flex-direction: column;
    position: relative; box-shadow: 0 0 60px rgba(0,0,0,.6);
  }

  header {
    padding: 14px 16px 10px; background: var(--panel);
    border-bottom: 1px solid var(--borde); position: sticky; top: 0; z-index: 10;
  }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .marca { font-size: 12px; letter-spacing: .5px; color: var(--tenue); text-transform: uppercase; }
  #cap-titulo { font-size: 15px; font-weight: 700; margin: 2px 0 0; }
  #btn-reiniciar {
    background: transparent; border: 1px solid var(--borde); color: var(--tenue);
    border-radius: 8px; padding: 6px 8px; font-size: 12px; cursor: pointer; flex: none;
  }
  #paso-actual {
    margin-top: 8px; font-size: 11px; font-weight: 700; color: var(--naranja);
    text-transform: uppercase; letter-spacing: .6px;
  }

  .indicador { margin-top: 10px; }
  .indicador-etq { display: flex; justify-content: space-between; font-size: 11px; color: var(--tenue); margin-bottom: 4px; }
  .barra { height: 8px; background: #0a0e14; border-radius: 6px; overflow: hidden; border: 1px solid var(--borde); }
  .fill { height: 100%; width: 50%; transition: width .5s ease, background .3s; border-radius: 6px; }
  .fill.ok { background: linear-gradient(90deg,#238636,#2ea043); }
  .fill.med { background: linear-gradient(90deg,#9e6a03,#d29922); }
  .fill.bajo { background: linear-gradient(90deg,#a81f1c,#da3633); }

  #app { flex: 1; padding: 16px; padding-bottom: 40px; overflow-y: auto; }

  .card { background: var(--panel); border: 1px solid var(--borde); border-radius: 16px;
    padding: 18px; margin-bottom: 14px; animation: aparece .35s ease; }
  @keyframes aparece { from { opacity: 0; transform: translateY(8px);} to {opacity:1; transform:none;} }
  h2 { font-size: 19px; margin: 0 0 10px; line-height: 1.25; }
  .cuerpo { font-size: 15px; line-height: 1.55; color: #d6dde6; margin: 0 0 4px; }

  .dialogo { margin-top: 14px; background: var(--panel-2); border-left: 3px solid var(--azul);
    border-radius: 10px; padding: 12px; }
  .dialogo-cabecera { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .avatar { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center;
    justify-content: center; font-weight: 700; color: #fff; flex: none; }
  .dialogo-nombre { font-size: 13px; font-weight: 700; }
  .dialogo-rol { font-size: 11px; color: var(--tenue); }
  .dialogo-texto { font-size: 14px; line-height: 1.5; font-style: italic; color: #e6edf3; }

  .btn { display: block; width: 100%; border-radius: 12px; padding: 14px 16px; font-size: 15px;
    border: 1px solid var(--borde); background: var(--panel-2); color: var(--texto);
    cursor: pointer; text-align: left; line-height: 1.4; transition: transform .08s, background .2s; }
  .btn:active { transform: scale(.985); }
  .btn.primario { background: var(--azul); border-color: var(--azul); color: #fff;
    text-align: center; font-weight: 700; margin-top: 4px; }
  .opciones, .items { display: flex; flex-direction: column; gap: 10px; margin-bottom: 8px; }
  .opcion { position: relative; }
  .inerte { opacity: .55; }
  .elegida-ok { border-color: var(--verde); background: rgba(46,160,67,.14); opacity: 1; }
  .elegida-mal { border-color: var(--rojo); background: rgba(218,54,51,.14); opacity: 1; }

  .item { display: flex; align-items: flex-start; gap: 10px; background: var(--panel-2);
    border: 1px solid var(--borde); border-radius: 12px; padding: 12px; font-size: 14px; cursor: pointer; }
  .item input { width: 20px; height: 20px; margin-top: 1px; flex: none; accent-color: var(--naranja); }
  .item-ok { border-color: var(--verde); }
  .item-mal { border-color: var(--rojo); }
  .item-nota { flex-basis: 100%; margin-top: 8px; font-size: 12px; line-height: 1.45;
    padding-top: 8px; border-top: 1px dashed var(--borde); color: var(--tenue); }
  .item-nota.es-mue { color: #7ee2a8; }
  .item-nota.no-mue { color: #f0b072; }

  .feedback { border-radius: 14px; padding: 14px; margin-top: 6px; animation: aparece .3s ease; }
  .fb-ok { background: rgba(46,160,67,.12); border: 1px solid rgba(46,160,67,.5); }
  .fb-mal { background: rgba(210,153,34,.12); border: 1px solid rgba(210,153,34,.5); }
  .fb-titulo { font-weight: 700; font-size: 14px; margin-bottom: 2px; }
  .fb-delta { font-size: 12px; color: var(--tenue); margin-bottom: 8px; font-weight: 700; }
  .feedback p { font-size: 14px; line-height: 1.5; margin: 0 0 12px; }

  .medalla { font-size: 56px; text-align: center; margin-bottom: 6px; }
  .medalla.gris { filter: grayscale(1) opacity(.6); }
  .resultado { display: flex; gap: 12px; justify-content: center; margin: 12px 0; }
  .metrica { background: var(--panel-2); border: 1px solid var(--borde); border-radius: 12px;
    padding: 12px 18px; text-align: center; min-width: 110px; }
  .metrica span { font-size: 28px; font-weight: 800; display: block; }
  .metrica small { font-size: 11px; color: var(--tenue); }
  .insignia { text-align: center; background: rgba(210,153,34,.15); border: 1px solid var(--amarillo);
    border-radius: 12px; padding: 10px; font-weight: 700; margin: 8px 0 12px; }
  .prox { text-align: center; font-size: 12px; color: var(--tenue); margin-top: 12px; }
</style>

<div class="telefono">
    <header>
      <div class="top">
        <div>
          <div class="marca">🛡️ Guardianes del Control</div>
          <div id="cap-titulo">Capítulo A</div>

<script>
/*

 *   Paso 1 — Planificar el proceso (gobernanza, liderazgo, equipo, alcance)

 *
 * Formato: grafo de nodos interpretado por el motor (motor.js). El diseñador
 * instruccional puede editar este archivo sin tocar código.
 *
 * Tipos de nodo:
 *   escena     -> texto narrativo, avanza con "continuar"
 *   decision   -> opciones con efectos (puntos, banderas) y retroalimentación
 *   seleccion  -> el jugador marca varios ítems de una lista (identificar MUEs)

<script>
/*
 * Motor narrativo — intérprete del grafo de nodos.
 * Independiente del contenido: lee window.CAPITULO_A y lo renderiza.
 * Guardado automático en localStorage (simula el offline-first de la app).
 */
(function () {
  "use strict";

  var cap = window.CAPITULO_A;
  var app = document.getElementById("app");
  var barra = document.getElementById("indicador-valor");
  var barraFill = document.getElementById("indicador-fill");
  var pasoEl = document.getElementById("paso-actual");
  var CLAVE = "ccm_cap_a_estado";

  var estado = cargar() || {
    nodo: cap.inicio,
    indicador: cap.indicadorInicial,
    banderas: {},
    aciertosEval: 0,
    totalEval: 0
  };

  function guardar() {
    try { localStorage.setItem(CLAVE, JSON.stringify(estado)); } catch (e) {}
  }
  function cargar() {
    try { return JSON.parse(localStorage.getItem(CLAVE)); } catch (e) { return null; }
  }

  function clamp(n) { return Math.max(0, Math.min(100, n)); }

  function pintarIndicador() {
    var v = clamp(estado.indicador);
    barra.textContent = v;
    barraFill.style.width = v + "%";
    barraFill.className = "fill " + (v >= 65 ? "ok" : v >= 40 ? "med" : "bajo");
  }

  function pintarPaso(nodo) {
    pasoEl.textContent = nodo.paso || "";
    pasoEl.style.display = nodo.paso ? "block" : "none";
  }

  function persona(id) { return id ? cap.personajes[id] : null; }

  function bloqueDialogo(personaId, texto) {
    if (!texto) return "";
    var p = persona(personaId);
    var nombre = p ? p.nombre : "";
    var color = p ? p.color : "#888";
    var rol = p ? p.rol : "";
    return (
      '<div class="dialogo" style="border-color:' + color + '">' +
      '<div class="dialogo-cabecera"><span class="avatar" style="background:' + color + '">' +
      (nombre ? nombre.charAt(0) : "?") + "</span>" +
      '<div><div class="dialogo-nombre">' + esc(nombre) + "</div>" +
      '<div class="dialogo-rol">' + esc(rol) + "</div></div></div>" +
      '<div class="dialogo-texto">' + esc(texto) + "</div></div>"
    );
  }

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/\n/g, "<br>");
  }

  function ir(id) { estado.nodo = id; guardar(); render(); }

  function render() {
    var nodo = cap.nodos[estado.nodo];
    pintarIndicador();
    pintarPaso(nodo);
    app.scrollTop = 0;
    ({
      escena: renderEscena,
      decision: renderDecision,
      seleccion: renderSeleccion,
      evaluacion: renderEvaluacion,
      final: renderFinal
    }[nodo.tipo] || renderEscena)(nodo);
  }

  // ---------------------------------------------------------- ESCENA
  function renderEscena(nodo) {
    app.innerHTML =
      card(
        '<h2>' + esc(nodo.titulo) + "</h2>" +
        '<p class="cuerpo">' + esc(nodo.cuerpo) + "</p>" +
        bloqueDialogo(nodo.persona, nodo.dialogo)
      ) +
      '<button class="btn primario" id="continuar">Continuar</button>';
    document.getElementById("continuar").onclick = function () { ir(nodo.siguiente); };
  }

  // -------------------------------------------------------- DECISIÓN
  function renderDecision(nodo) {
    var html = card(
      '<h2>' + esc(nodo.titulo) + "</h2>" +
      '<p class="cuerpo">' + esc(nodo.cuerpo) + "</p>"
    );
    html += '<div class="opciones">';
    nodo.opciones.forEach(function (op, i) {
      html += '<button class="btn opcion" data-i="' + i + '">' + esc(op.texto) + "</button>";
    });
    html += "</div>";
    app.innerHTML = html;

    Array.prototype.forEach.call(app.querySelectorAll(".opcion"), function (b) {
      b.onclick = function () {
        var op = nodo.opciones[+b.dataset.i];
        estado.indicador = clamp(estado.indicador + (op.indicador || 0));
        if (op.bandera) estado.banderas[op.bandera] = true;
        guardar();
        pintarIndicador();

        Array.prototype.forEach.call(app.querySelectorAll(".opcion"), function (x) {
          x.disabled = true; x.classList.add("inerte");
        });
        b.classList.add(op.correcta ? "elegida-ok" : "elegida-mal");

        var fb = document.createElement("div");
        fb.className = "feedback " + (op.correcta ? "fb-ok" : "fb-mal");
        fb.innerHTML =
          '<div class="fb-titulo">' + (op.correcta ? "✓ Bien" : "Reflexiona") + "</div>" +
          '<div class="fb-delta">' + deltaTexto(op.indicador) + "</div>" +
          "<p>" + esc(op.feedback) + "</p>" +
          '<button class="btn primario" id="seguir">Continuar</button>';
        app.appendChild(fb);
        fb.scrollIntoView({ behavior: "smooth", block: "nearest" });
        document.getElementById("seguir").onclick = function () { ir(nodo.siguiente); };
      };
    });
  }

  function deltaTexto(d) {
    if (!d) return "";
    return (d > 0 ? "▲ +" : "▼ ") + d + " Seguridad de la mina";
  }

  // -------------------------------------------------------- SELECCIÓN
  function renderSeleccion(nodo) {
    var html = card(
      '<h2>' + esc(nodo.titulo) + "</h2>" +
      '<p class="cuerpo">' + esc(nodo.cuerpo) + "</p>"
    );
    html += '<div class="items">';
    nodo.items.forEach(function (it, i) {
      html += '<label class="item"><input type="checkbox" data-i="' + i + '">' +
        '<span>' + esc(it.texto) + "</span></label>";
    });
    html += "</div>";
    html += '<button class="btn primario" id="verificar">Verificar selección</button>';
    app.innerHTML = html;

    document.getElementById("verificar").onclick = function () {
      var marcados = {};
      Array.prototype.forEach.call(app.querySelectorAll('input[type=checkbox]'), function (c) {
        marcados[+c.dataset.i] = c.checked;
        c.disabled = true;
      });
      var correctas = 0;
      nodo.items.forEach(function (it, i) {
        var acierto = !!marcados[i] === !!it.esMUE;
        if (acierto) correctas++;
        var label = app.querySelectorAll(".item")[i];
        label.classList.add(acierto ? "item-ok" : "item-mal");
        var nota = document.createElement("div");
        nota.className = "item-nota " + (it.esMUE ? "es-mue" : "no-mue");
        nota.innerHTML = (it.esMUE ? "★ MUE — " : "○ No MUE — ") + esc(it.nota);
        label.appendChild(nota);
      });

      var aprob = correctas >= nodo.minCorrectas;
      estado.indicador = clamp(estado.indicador + (aprob ? 14 : -6));
      guardar();
      pintarIndicador();

      document.getElementById("verificar").style.display = "none";
      var fb = document.createElement("div");
      fb.className = "feedback " + (aprob ? "fb-ok" : "fb-mal");
      fb.innerHTML =
        '<div class="fb-titulo">' + correctas + " / " + nodo.items.length + " correctas</div>" +
        "<p>" + esc(aprob ? nodo.feedbackAlto : nodo.feedbackBajo) + "</p>" +
        '<button class="btn primario" id="seguir">Continuar</button>';
      app.appendChild(fb);
      fb.scrollIntoView({ behavior: "smooth", block: "nearest" });
      document.getElementById("seguir").onclick = function () { ir("p2_ranking"); };
    };
  }

  // ------------------------------------------------------ EVALUACIÓN
  function renderEvaluacion(nodo) {
    var html = card(
      '<h2>' + esc(nodo.titulo) + "</h2>" +
      '<p class="cuerpo">' + esc(nodo.cuerpo) + "</p>"
    );
    html += '<div class="opciones">';
    nodo.opciones.forEach(function (op, i) {
      html += '<button class="btn opcion" data-i="' + i + '">' + esc(op.texto) + "</button>";
    });
    html += "</div>";
    app.innerHTML = html;

    Array.prototype.forEach.call(app.querySelectorAll(".opcion"), function (b) {
      b.onclick = function () {
        var op = nodo.opciones[+b.dataset.i];
        estado.totalEval++;
        if (op.correcta) { estado.aciertosEval++; estado.indicador = clamp(estado.indicador + 6); }
        else { estado.indicador = clamp(estado.indicador - 4); }
        guardar();
        pintarIndicador();

        Array.prototype.forEach.call(app.querySelectorAll(".opcion"), function (x, i) {
          x.disabled = true; x.classList.add("inerte");
          if (nodo.opciones[i].correcta) x.classList.add("elegida-ok");
        });
        if (!op.correcta) b.classList.add("elegida-mal");

        var fb = document.createElement("div");
        fb.className = "feedback " + (op.correcta ? "fb-ok" : "fb-mal");
        fb.innerHTML = "<p>" + esc(op.correcta ? nodo.feedbackOk : nodo.feedbackNo) + "</p>" +
          '<button class="btn primario" id="seguir">Continuar</button>';
        app.appendChild(fb);
        fb.scrollIntoView({ behavior: "smooth", block: "nearest" });
        document.getElementById("seguir").onclick = function () { ir(nodo.siguiente); };
      };
    });
  }

  // ----------------------------------------------------------- FINAL
  function renderFinal(nodo) {
    var v = clamp(estado.indicador);
    var aprob = v >= nodo.umbralAprobacion;
    var dialogo = aprob ? nodo.dialogoAlto : nodo.dialogoBajo;

    app.innerHTML =
      card(
        '<div class="medalla ' + (aprob ? "" : "gris") + '">🛡️</div>' +
        '<h2 style="text-align:center">' + esc(nodo.titulo) + "</h2>" +
        '<div class="resultado">' +
          '<div class="metrica"><span>' + v + '</span><small>Seguridad de la mina</small></div>' +
          '<div class="metrica"><span>' + estado.aciertosEval + "/" + estado.totalEval +
            '</span><small>Evaluación</small></div>' +
        "</div>" +
        (aprob ? '<div class="insignia">🏅 Insignia obtenida: ' + esc(nodo.insignia) + "</div>" : "") +
        '<p class="cuerpo">' + esc(nodo.cuerpo) + "</p>" +
        bloqueDialogo(nodo.persona, dialogo)
      ) +
      '<button class="btn primario" id="reiniciar">Volver a jugar el capítulo</button>' +
      '<div class="prox">Próximamente: Capítulo B — «Del bowtie al control crítico»</div>';

    document.getElementById("reiniciar").onclick = function () {
      localStorage.removeItem(CLAVE);
      estado = { nodo: cap.inicio, indicador: cap.indicadorInicial, banderas: {}, aciertosEval: 0, totalEval: 0 };
      guardar();
      render();
    };
  }

  function card(inner) { return '<div class="card">' + inner + "</div>"; }

  // Botón de reinicio global (en la barra superior)
  document.getElementById("btn-reiniciar").onclick = function () {
    if (confirm("¿Reiniciar el capítulo desde el principio?")) {
      localStorage.removeItem(CLAVE);
      estado = { nodo: cap.inicio, indicador: cap.indicadorInicial, banderas: {}, aciertosEval: 0, totalEval: 0 };
      guardar();
      render();
    }
  };

  document.getElementById("cap-titulo").textContent = cap.titulo;
  render();
})();

</script>
